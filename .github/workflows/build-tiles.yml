name: Build places tiles

# Custom Welcome Book — nearby-places data.
# Turns Foursquare's open places dataset (FSQ OS Places, Apache-2.0, mirrored on Hugging Face)
# into one small map-tile file: US only, open businesses only, our six categories only.
# Publishes it as a release asset named "tiles" that the Cloudflare Worker range-reads.
# Runs monthly (Foursquare refreshes around the middle of each month) and on demand.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 16 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Tools (tippecanoe from source, DuckDB)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev >/dev/null
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          (cd /tmp/tippecanoe && make -j"$(nproc)" >/dev/null 2>&1 && sudo make install >/dev/null)
          python3 -m pip install --quiet duckdb
          tippecanoe --version

      - name: Find Foursquare's latest release
        id: rel
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          url = 'https://huggingface.co/api/datasets/foursquare/fsq-os-places/tree/main/release'
          items = json.load(urllib.request.urlopen(url))
          dts = sorted(re.sub(r'.*dt=', '', i['path']) for i in items if i.get('type') == 'directory' and 'dt=' in i['path'])
          assert dts, 'no dt= partitions found on Hugging Face'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('dt=' + dts[-1] + '\n')
          print('latest Foursquare release:', dts[-1])
          PY

      - name: Extract US open places in our six categories (download each Hugging Face file, filter, delete)
        env:
          DT: ${{ steps.rel.outputs.dt }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pip install --quiet huggingface_hub
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          python3 - <<'PY'
          import duckdb, os, time, sys
          from huggingface_hub import HfApi, hf_hub_download
          dt = os.environ['DT']; repo = 'foursquare/fsq-os-places'
          token = os.environ.get('HF_TOKEN') or None          # optional; public dataset works without one
          prefix = f'release/dt={dt}/places/parquet'
          api = HfApi(token=token)
          files = sorted(f.path for f in api.list_repo_tree(repo, repo_type='dataset', path_in_repo=prefix) if f.path.endswith('.parquet'))
          assert files, f'no parquet files under {prefix}'
          print(len(files), 'parquet files in release', dt)
          # The category rules MIRROR the Worker's CAT_RX / CAT_NOT — change both together.
          # v2 tune (2026-09-05, from the first real file): food trucks and cafeterias out, landscapers /
          # garden centers and "campground"-tagged rental cabins out of park, juice bars and airport
          # lounges out of winery, college venues out of museum. MIRRORS the Worker's CAT_RX / CAT_NOT.
          RX = {
            'restaurant': (r'(?i)restaurant|diner|steakhouse|pizzeria|pizza|taco|bbq|barbecue|burger|grill|bistro|eatery', r'(?i)food truck|cafeteria'),
            'cafe':       (r'(?i)caf[eé]|coffee|bakery|donut|doughnut|tea house|tea room|creperie|dessert|ice cream', r'(?i)cafeteria|gaming cafe|internet cafe|fuel station'),
            'grocery':    (r'(?i)grocery|supermarket|farmers market|food and beverage retail|general store|market\b', r'(?i)flea market|stock market|marketing'),
            'winery':     (r'(?i)brewery|winery|distillery|taproom|beer garden|wine bar|\bbar\b|pub\b|cidery|meadery|lounge', r'(?i)barber|bar & grill|juice bar|travel lounge|airport'),
            'park':       (r'(?i)\bpark\b|trail|playground|nature preserve|nature reserve|hiking|scenic|botanical|\bgarden\b|beach|lake|waterfall|national forest|state forest', r'(?i)parking|park and ride|business park|office park|industrial park|rv park|trailer park|mobile home|landscap|gardener|garden center|nursery'),
            'museum':     (r'(?i)museum|art gallery|theater|theatre|bowling|arcade|aquarium|zoo|amusement|historic site|planetarium|science center|concert hall|performing arts', r'(?i)college'),
          }
          def q(s): return "'" + s.replace("'", "''") + "'"
          case = 'CASE '
          for k in ['restaurant', 'cafe', 'grocery', 'winery', 'park', 'museum']:
            rx, nrx = RX[k]
            cond = f"regexp_matches(labels, {q(rx)})" + (f" AND NOT regexp_matches(labels, {q(nrx)})" if nrx else '')
            case += f"WHEN {cond} THEN '{k}' "
          case += 'END'
          con = duckdb.connect('/mnt/work/places.duckdb')
          con.execute("SET threads=4; SET memory_limit='4GB'; SET preserve_insertion_order=false;")
          con.execute("CREATE TABLE IF NOT EXISTS places (id VARCHAR, name VARCHAR, lat DOUBLE, lon DOUBLE, address VARCHAR, locality VARCHAR, region VARCHAR, postcode VARCHAR, labels VARCHAR, bucket VARCHAR)")
          t0 = time.time(); total = 0
          for i, path in enumerate(files):
            local = None
            for attempt in range(4):
              try:
                local = hf_hub_download(repo, filename=path, repo_type='dataset', token=token, local_dir='/mnt/work/dl'); break
              except Exception as e:
                print(f'  download retry {attempt+1} for {path}: {e}'); time.sleep(10 * (attempt + 1))
            if not local: sys.exit(f'could not download {path}')
            n = con.execute(f"""
              INSERT INTO places
              SELECT id, name, lat, lon, address, locality, region, postcode, labels, bucket FROM (
                SELECT fsq_place_id AS id, name, latitude AS lat, longitude AS lon,
                       coalesce(address,'') AS address, coalesce(locality,'') AS locality,
                       coalesce(region,'') AS region, coalesce(postcode,'') AS postcode,
                       labels, {case} AS bucket
                FROM (
                  SELECT *, array_to_string(fsq_category_labels, ' | ') AS labels
                  FROM read_parquet({q(local)})
                  WHERE country = 'US' AND date_closed IS NULL AND name IS NOT NULL
                    AND latitude IS NOT NULL AND longitude IS NOT NULL
                )
              ) WHERE bucket IS NOT NULL
            """).fetchall()
            os.remove(local)
            cnt = con.execute("SELECT count(*) FROM places").fetchone()[0]
            print(f'  [{i+1}/{len(files)}] {os.path.basename(path)} → {cnt - total:,} kept (total {cnt:,}) · {time.time()-t0:.0f}s')
            total = cnt
          con.execute("COPY places TO 'us.csv' (HEADER, DELIMITER ',')")
          print(f'{total:,} places kept from release {dt} in {time.time()-t0:.0f}s')
          with open('count.txt', 'w') as f: f.write(str(total))
          con.close()
          PY
          rm -rf /mnt/work/dl

      - name: Convert to line-delimited GeoJSON
        run: |
          python3 - <<'PY'
          import csv, json, sys
          csv.field_size_limit(1 << 24)
          n = 0
          with open('us.csv', newline='', encoding='utf-8') as f, open('us.geojsonseq', 'w', encoding='utf-8') as out:
            for row in csv.DictReader(f):
              try: lat, lon = float(row['lat']), float(row['lon'])
              except: continue
              props = {k: row[k] for k in ('name', 'address', 'locality', 'region', 'postcode', 'labels', 'bucket', 'id') if row.get(k)}
              out.write(json.dumps({'type': 'Feature', 'properties': props, 'geometry': {'type': 'Point', 'coordinates': [round(lon, 6), round(lat, 6)]}}, ensure_ascii=False) + '\n')
              n += 1
          print(n, 'features written')
          PY
          rm -f us.csv

      - name: Build the tile file (z12 = everything; z10–11 = destinations only for wide searches)
        run: |
          set -e
          tippecanoe -o fsq-us.pmtiles -l place -n "Custom Welcome Book places" \
            -Z10 -z12 -r1 --no-feature-limit --no-tile-size-limit \
            -j '{"place":["any",[">=","$zoom",12],["in","bucket","park","museum","winery"]]}' \
            -P --force us.geojsonseq
          ls -la fsq-us.pmtiles
          rm -f us.geojsonseq

      - name: Manifest
        env:
          DT: ${{ steps.rel.outputs.dt }}
        run: |
          python3 - <<'PY'
          import json, os, time
          json.dump({'source': 'Foursquare OS Places (Apache-2.0) via huggingface.co/datasets/foursquare/fsq-os-places',
                     'release': os.environ['DT'], 'built': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                     'features': int(open('count.txt').read()), 'bytes': os.path.getsize('fsq-us.pmtiles'),
                     'zooms': {'12': 'all six categories', '10-11': 'park, museum, winery only'}},
                    open('manifest.json', 'w'), indent=2)
          print(open('manifest.json').read())
          PY

      - name: Publish as the "tiles" release (overwrites the previous file)
        run: |
          set -e
          gh release view tiles --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create tiles --repo "$GITHUB_REPOSITORY" --title "Places tiles" \
              --notes "Nearby-places tile file for Custom Welcome Book. Contains data from Foursquare OS Places (Apache License 2.0). Rebuilt monthly."
          gh release upload tiles fsq-us.pmtiles manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/download/tiles/fsq-us.pmtiles"
