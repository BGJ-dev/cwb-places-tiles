name: Build places tiles

# Custom Welcome Book — nearby-places data.
# Turns Foursquare's open places dataset (FSQ OS Places, Apache-2.0, mirrored on Hugging Face)
# into one small map-tile file: US only, open businesses only, our six categories only.
# Publishes it as a release asset named "tiles" that the Cloudflare Worker range-reads.
# v3 (2026-09-05): data-quality rules — primary-label whitelists, office/service rejection, name rules,
# a staleness floor, a 0–6 quality score, duplicate collapse, and a printed rejection report.
# v4 (2026-09-05, night): MARK, DON'T DELETE — stale / name-rule / low-quality rows stay in the file as a
# search-only tier (t=1) the seeder never offers; staleness floor and offer floor are per bucket; an optional
# website-liveness audit (tick the box when running) tests the free "still open?" proxy.
# The rules JSON inside MIRRORS the Worker's RULES — change both, run the mirror check.
# Runs monthly (Foursquare refreshes around the middle of each month) and on demand.

on:
  workflow_dispatch:
    inputs:
      audit_websites:
        description: 'Also knock on ~480 websites and report the dead rate by year (adds ~3 min)'
        type: boolean
        default: false
  schedule:
    - cron: '0 10 16 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_WEBSITES: ${{ (github.event.inputs.audit_websites == 'true') && '1' || '0' }}
    steps:
      - name: Tools (tippecanoe from source, DuckDB)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev >/dev/null
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          (cd /tmp/tippecanoe && make -j"$(nproc)" >/dev/null 2>&1 && sudo make install >/dev/null)
          python3 -m pip install --quiet duckdb
          tippecanoe --version

      - name: Find Foursquare's latest release
        id: rel
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          url = 'https://huggingface.co/api/datasets/foursquare/fsq-os-places/tree/main/release'
          items = json.load(urllib.request.urlopen(url))
          dts = sorted(re.sub(r'.*dt=', '', i['path']) for i in items if i.get('type') == 'directory' and 'dt=' in i['path'])
          assert dts, 'no dt= partitions found on Hugging Face'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('dt=' + dts[-1] + '\n')
          print('latest Foursquare release:', dts[-1])
          PY

      - name: Extract US open places in our six categories — data quality v3 (download each file, classify, score, dedupe)
        env:
          DT: ${{ steps.rel.outputs.dt }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pip install --quiet huggingface_hub
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          python3 - <<'PY'
          # Custom Welcome Book — places file build, extract step v4 (mark, don't delete).
          # Runs inside the GitHub Actions job (see build-tiles.yml). Also runnable locally against any
          # parquet files for validation:  python3 extract_v4.py --files a.parquet b.parquet --out ./work
          import duckdb, os, sys, time, json, argparse

          RULES = json.loads(r'''{
            "version": 4,
            "note": "THE category rules for the places file. Used verbatim by the build job (DuckDB, RE2 syntax) and the Worker (JS). Change here, then run the mirror check. v4: stale_before and offer_floor are PER BUCKET; a stale / name-rule / low-quality row is MARKED search-only (t=1) rather than deleted, so a host can always find it by name; only non-venues (label rejections, junk names, big-box-not-grocery) are dropped. demote_primary: a bare or vague top-level label (e.g. 'Other Great Outdoors') is search-only. reject_name_outdoors: non-destination businesses that carry an outdoors/arts label (a gas station tagged 'Other Great Outdoors', a mover tagged 'River') are search-only in park / museum / winery.",
            "primary": {
              "restaurant": "^Dining and Drinking > Restaurant",
              "cafe": "^Dining and Drinking > (Cafe, Coffee, and Tea House|Bakery|Dessert Shop|Donut Shop|Creperie|Bagel Shop)",
              "grocery": "^Retail > (Food and Beverage Retail > (Grocery Store|Supermarket|Farmers Market|Health Food Store|Butcher|Fish Market|Cheese Store|Gourmet Store|Organic Grocery|Meat and Seafood|Fruit and Vegetable Store)|Big Box Store)",
              "winery": "^Dining and Drinking > (Winery|Brewery|Distillery|Bar( > (Wine Bar|Beer Bar|Cocktail Bar|Pub|Irish Pub|Sports Bar|Dive Bar|Beer Garden|Speakeasy|Whisky Bar|Rooftop Bar|Piano Bar|Tiki Bar|Hotel Bar|Lounge|Gastropub|Taproom))?$)",
              "park": "^Landmarks and Outdoors > (Park|Beach|Scenic Lookout|Hiking Trail|Trail|Bike Trail|Nature Preserve|Nature Reserve|Lake|Waterfall|Garden|Botanical Garden|Sculpture Garden|Forest|Mountain|River|Reservoir|Canyon|Cave|Hot Spring|Island|Bay|Harbor|Marina|Dog Park|Playground|Picnic Area|State Park|National Park|Wildlife|Other Great Outdoors)",
              "museum": "^(Arts and Entertainment > (Museum|Art Gallery|Performing Arts Venue|Movie Theater|Arcade|Bowling Alley|Zoo|Aquarium|Amusement Park|Water Park|Mini Golf Course|Planetarium|Science Museum|History Museum|Art Museum|Exhibit|Public Art)|Landmarks and Outdoors > (Historic and Protected Site|Monument|Landmark|Historic Site))"
            },
            "reject_any_label": "(Business and Professional Services|Health and Medicine|Travel and Transportation > (Lodging|Fuel Station|Travel Lounge|Transportation|Moving)|Storage Facility|Self Storage|Retail > (Home Improvement|Automotive|Furniture and Home|Garden Center|Pet)|Community and Government > (Education|Government|Organization|Religious|Military)|Sports and Recreation > (Gym|Fitness|Athletic)|Event > |Office|Home Service|Event Space|Consult|Real Estate|Landscap|Food Truck|Cafeteria|Gaming Cafe|Internet Cafe|College|Night Club|Strip Club|Adult|Hookah|Vape|Smoke Shop)",
            "reject_name": "(?i)\\b(at home|mobile|delivery only|catering|caterers?|concierge|consult(ing|ants?)|services?|llc|inc\\.?|ltd\\.?|corp\\.?|enterprises|solutions|wholesale|distribut(or|ion)|vending|permanently closed|closed)\\b",
            "grocery_bigbox_needs": "(Supermarket|Grocery Store)",
            "chains": "(?i)^(mcdonald|subway|sonic drive|whataburger|starbucks|walmart|dollar general|domino|pizza hut|taco bell|wendy|burger king|chick-fil-a|dunkin|kfc|popeyes|arby|jack in the box|little caesars|papa john|chipotle|panda express|waffle house|ihop|denny|cracker barrel|applebee|chili's|olive garden|dairy queen|wingstop|zaxby|culver|in-n-out|five guys|jimmy john|jersey mike|firehouse subs|panera|dutch bros|7-eleven|circle k|walgreens|cvs|taco cabana|bill miller|raising cane|church's|carl's jr|hardee|long john silver|schlotzsky|cicis|golden corral|red lobster|texas roadhouse|outback|buffalo wild wings|hooters|twin peaks|dave & buster|main event|sam's club|costco|h-e-b plus)",
            "fast_food_label": "Fast Food Restaurant",
            "score": {
              "address": 1,
              "tel": 1,
              "website": 1,
              "social": 1,
              "refreshed_since_2024": 1,
              "refreshed_since_2025_06": 1,
              "chain_penalty": -2,
              "fast_food_penalty": -1
            },
            "dedupe_grid_deg": 0.003,
            "stale_before": {
              "restaurant": "2023-01-01",
              "cafe": "2023-01-01",
              "grocery": "2023-01-01",
              "winery": "2021-01-01",
              "park": "2021-01-01",
              "museum": "2021-01-01"
            },
            "offer_floor": {
              "restaurant": 3,
              "cafe": 3,
              "grocery": 3,
              "winery": 2,
              "park": 2,
              "museum": 2
            },
            "search_only": [
              "stale",
              "name",
              "low-q",
              "vague"
            ],
            "demote_primary": "^(Landmarks and Outdoors > Other Great Outdoors|Landmarks and Outdoors|Arts and Entertainment|Dining and Drinking|Retail)$",
            "reject_name_outdoors": "(?i)\\b(citgo|shell|exxon|chevron|valero|marathon|sunoco|texaco|mobil|phillips 66|conoco|speedway|wawa|sheetz|buc-ee'?s|quiktrip|racetrac|pilot travel|love'?s travel|casey'?s|kum & go|circle k|gas station|fuel|truck stop|self storage|storage|moving|apartments?|condominiums?|tire|auto|towing|rental|realty|real estate|dental|clinic|pharmacy|bank|credit union|insurance|funeral|cemetery services)\\b"
          }''')

          def q(s): return "'" + s.replace("'", "''") + "'"

          def classify_sql(src_sql, cols=None):
              """One SELECT over a source relation with the FSQ OS Places schema → candidate rows with
                 bucket + rejection reason. Primary label decides the bucket; ANY label can reject.
                 `cols` = the file's actual column names: optional columns that are absent become NULL and
                 every optional column is read as text, so a schema drift never breaks the build."""
              P = RULES['primary']
              have = set(cols) if cols else None
              def txt(c):   # optional text column → VARCHAR expression
                  return f"CAST({c} AS VARCHAR)" if (have is None or c in have) else "NULL::VARCHAR"
              def dat(c):   # optional date column → DATE expression
                  return f"TRY_CAST({c} AS DATE)" if (have is None or c in have) else "NULL::DATE"
              case = 'CASE '
              for k in ['restaurant', 'cafe', 'grocery', 'winery', 'park', 'museum']:
                  case += f"WHEN regexp_matches(prim, {q(P[k])}) THEN '{k}' "
              case += 'END'
              return f"""
                SELECT CAST(fsq_place_id AS VARCHAR) AS id, CAST(name AS VARCHAR) AS name, CAST(latitude AS DOUBLE) AS lat, CAST(longitude AS DOUBLE) AS lon,
                       coalesce({txt('address')},'') AS address, coalesce({txt('locality')},'') AS locality,
                       coalesce({txt('region')},'') AS region, coalesce({txt('postcode')},'') AS postcode,
                       labels, prim, bucket,
                       CASE
                         WHEN regexp_matches(labels, {q(RULES['reject_any_label'])}) THEN 'label'
                         WHEN regexp_matches(name, {q(RULES['reject_name'])}) THEN 'name'
                         WHEN bucket IN ('park', 'museum', 'winery') AND regexp_matches(name, {q(RULES['reject_name_outdoors'])}) THEN 'name'
                         WHEN regexp_matches(prim, {q(RULES['demote_primary'])}) THEN 'vague'
                         WHEN length(trim(name)) < 3 OR regexp_matches(name, '^[0-9 ()+.-]+$') THEN 'junk-name'
                         WHEN bucket = 'grocery' AND regexp_matches(prim, '^Retail > Big Box Store') AND NOT regexp_matches(labels, {q(RULES['grocery_bigbox_needs'])}) THEN 'bigbox-not-grocery'
                         WHEN bucket = 'restaurant' AND {dat('date_refreshed')} < DATE '{RULES['stale_before']['restaurant']}' THEN 'stale' WHEN bucket = 'cafe' AND {dat('date_refreshed')} < DATE '{RULES['stale_before']['cafe']}' THEN 'stale' WHEN bucket = 'grocery' AND {dat('date_refreshed')} < DATE '{RULES['stale_before']['grocery']}' THEN 'stale' WHEN bucket = 'winery' AND {dat('date_refreshed')} < DATE '{RULES['stale_before']['winery']}' THEN 'stale' WHEN bucket = 'park' AND {dat('date_refreshed')} < DATE '{RULES['stale_before']['park']}' THEN 'stale' WHEN bucket = 'museum' AND {dat('date_refreshed')} < DATE '{RULES['stale_before']['museum']}' THEN 'stale'
                         ELSE NULL
                       END AS rej,
                       coalesce({txt('website')},'') AS website,
                       (CASE WHEN length(trim(coalesce({txt('address')},''))) > 0 AND coalesce({txt('po_box')},'') = '' THEN {RULES['score']['address']} ELSE 0 END
                        + CASE WHEN coalesce({txt('tel')},'') <> '' THEN {RULES['score']['tel']} ELSE 0 END
                        + CASE WHEN coalesce({txt('website')},'') <> '' THEN {RULES['score']['website']} ELSE 0 END
                        + CASE WHEN coalesce({txt('instagram')},'') <> '' OR coalesce({txt('facebook_id')},'') <> '' OR coalesce({txt('twitter')},'') <> '' OR coalesce({txt('email')},'') <> '' THEN {RULES['score']['social']} ELSE 0 END
                        + CASE WHEN {dat('date_refreshed')} >= DATE '2024-01-01' THEN {RULES['score']['refreshed_since_2024']} ELSE 0 END
                        + CASE WHEN {dat('date_refreshed')} >= DATE '2025-06-01' THEN {RULES['score']['refreshed_since_2025_06']} ELSE 0 END
                        + CASE WHEN regexp_matches(name, {q(RULES['chains'])}) THEN {RULES['score']['chain_penalty']} ELSE 0 END
                        + CASE WHEN labels LIKE {q('%' + RULES['fast_food_label'] + '%')} THEN {RULES['score']['fast_food_penalty']} ELSE 0 END) AS q_raw,
                       CASE WHEN regexp_matches(name, {q(RULES['chains'])}) THEN 1 ELSE 0 END AS chain,
                       year({dat('date_refreshed')}) AS ry
                FROM (
                  SELECT *, array_to_string(fsq_category_labels, ' | ') AS labels,
                         coalesce(fsq_category_labels[1], '') AS prim,
                         {case} AS bucket
                  FROM ({src_sql})
                  WHERE country = 'US' AND date_closed IS NULL AND name IS NOT NULL
                    AND latitude IS NOT NULL AND longitude IS NOT NULL
                ) WHERE bucket IS NOT NULL
              """

          def audit_websites(con, n=480, timeout=6, workers=24):
              """THE PROXY QUESTION (Brandon, 2026-09-05): can a dead website stand in for a paid "still open?" check?
                 Sample offerable eat/drink/grocery rows that list a website, stratified by refresh year, and knock on
                 each: DNS failure / refused / timeout = DEAD; any HTTP answer (even 403/404) = ALIVE (the domain lives).
                 Prints the dead rate by year and by score — the evidence for or against the proxy."""
              import urllib.request, urllib.error, socket, ssl, concurrent.futures, random
              rows = con.execute(f"""
                  SELECT name, bucket, website, q, coalesce(ry, 0) AS ry FROM (
                    SELECT *, row_number() OVER (PARTITION BY coalesce(ry, 0) ORDER BY random()) AS rn
                    FROM places WHERE t = 0 AND bucket IN ('restaurant', 'cafe', 'grocery') AND website <> '' AND website LIKE 'http%'
                  ) WHERE rn <= {n // 6} """).fetchall()
              ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
              def knock(u):
                  try:
                      req = urllib.request.Request(u, method='HEAD', headers={'User-Agent': 'Mozilla/5.0 (compatible; CWB places audit; +https://customwelcomebook.example)'})
                      with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r: return 'alive', r.status
                  except urllib.error.HTTPError as e: return ('alive', e.code)          # the server answered — the domain lives
                  except (urllib.error.URLError, socket.timeout, ConnectionError, OSError, ValueError) as e:
                      return ('dead', str(getattr(e, 'reason', e))[:60])
                  except Exception as e: return ('unknown', str(e)[:60])
              print(f'\n== website liveness audit: {len(rows)} offerable eat/drink/grocery rows with a website, by refresh year', flush=True)
              t0 = time.time(); results = []
              with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as ex:
                  for (row, res) in zip(rows, ex.map(lambda r: knock(r[2]), rows)): results.append((row, res))
              by = {}
              for (name, bucket, site, qv, ry), (state, info) in results:
                  o = by.setdefault(ry, {'n': 0, 'dead': 0, 'unknown': 0}); o['n'] += 1
                  if state == 'dead': o['dead'] += 1
                  elif state == 'unknown': o['unknown'] += 1
              print('   year · sites · dead · dead% · unknown')
              for ry in sorted(by): o = by[ry]; print(f'   {ry} · {o["n"]} · {o["dead"]} · {round(100*o["dead"]/o["n"]) if o["n"] else 0}% · {o["unknown"]}')
              byq = {}
              for (name, bucket, site, qv, ry), (state, info) in results:
                  o = byq.setdefault(qv, {'n': 0, 'dead': 0}); o['n'] += 1; o['dead'] += (state == 'dead')
              print('   score q · sites · dead%'); 
              for qv in sorted(byq): o = byq[qv]; print(f'   q{qv} · {o["n"]} · {round(100*o["dead"]/o["n"]) if o["n"] else 0}%')
              print('   sample of DEAD sites (name · bucket · year · q · why):')
              dead = [(r, i) for r, (s, i) in results if s == 'dead']; random.shuffle(dead)
              for (name, bucket, site, qv, ry), why in dead[:25]: print(f'     {name} · {bucket} · {ry} · q{qv} · {site} · {why}')
              print(f'   audit took {time.time()-t0:.0f}s', flush=True)

          def run(files, workdir, download=None, token=None):
              os.makedirs(workdir, exist_ok=True)
              con = duckdb.connect(os.path.join(workdir, 'places.duckdb'))
              con.execute("SET threads=4; SET memory_limit='4GB'; SET preserve_insertion_order=false;")
              con.execute("CREATE OR REPLACE TABLE cand (id VARCHAR, name VARCHAR, lat DOUBLE, lon DOUBLE, address VARCHAR, locality VARCHAR, region VARCHAR, postcode VARCHAR, labels VARCHAR, prim VARCHAR, bucket VARCHAR, rej VARCHAR, website VARCHAR, q_raw INTEGER, chain INTEGER, ry INTEGER)")
              t0 = time.time(); cols = None
              for i, path in enumerate(files):
                  local = download(path) if download else path
                  if cols is None:
                      cols = [r[0] for r in con.execute(f"DESCRIBE SELECT * FROM read_parquet({q(local)})").fetchall()]
                      print('schema of the first file:', ', '.join(cols), flush=True)
                      for need in ('fsq_place_id', 'name', 'latitude', 'longitude', 'country', 'date_closed', 'fsq_category_labels'):
                          assert need in cols, f'required column missing: {need}'
                      missing = [c for c in ('address', 'locality', 'region', 'postcode', 'po_box', 'tel', 'website', 'email', 'instagram', 'facebook_id', 'twitter', 'date_refreshed') if c not in cols]
                      if missing: print('optional columns absent in this release (treated as empty):', ', '.join(missing), flush=True)
                  con.execute("INSERT INTO cand " + classify_sql(f"SELECT * FROM read_parquet({q(local)})", cols))
                  if download: os.remove(local)
                  n = con.execute("SELECT count(*) FROM cand").fetchone()[0]
                  print(f'  [{i+1}/{len(files)}] {os.path.basename(path)} → candidates so far {n:,} · {time.time()-t0:.0f}s', flush=True)
              # --- the report: what the rules did ---
              print('\n== candidates by bucket: offerable / search-only (stale · name · low-q · vague) / dropped (label · junk · bigbox)')
              F = RULES['offer_floor']
              floor_case = 'CASE bucket ' + ' '.join(f"WHEN '{b}' THEN {F[b]}" for b in F) + ' ELSE 3 END'
              for row in con.execute(f"""
                  SELECT bucket, count(*) FILTER (WHERE rej IS NULL AND q_raw >= {floor_case}) AS offer,
                         count(*) FILTER (WHERE rej='stale') AS so_stale, count(*) FILTER (WHERE rej='name') AS so_name,
                         count(*) FILTER (WHERE rej IS NULL AND q_raw < {floor_case}) AS so_lowq, count(*) FILTER (WHERE rej='vague') AS so_vague,
                         count(*) FILTER (WHERE rej='label') AS d_label, count(*) FILTER (WHERE rej='junk-name') AS d_junk, count(*) FILTER (WHERE rej='bigbox-not-grocery') AS d_bb
                  FROM cand GROUP BY bucket ORDER BY bucket""").fetchall():
                  print('  ', row)
              print('\n== sample of rejected rows (reason · bucket · name · primary label)')
              for row in con.execute("SELECT rej, bucket, name, prim FROM cand WHERE rej IN ('label','junk-name','bigbox-not-grocery') USING SAMPLE 40 ROWS").fetchall():
                  print('  ', row)
              # the staleness question (is the floor 5 years or 2?): how many venue rows Foursquare last refreshed in each year,
              # counting the ones the floor rejected too, so the floor can be moved with numbers instead of guesses
              print('\n== last refreshed, by year (venue-type rows only; "stale" = below the floor) · year · rows · of which stale')
              for row in con.execute("""
                  SELECT coalesce(ry, 0) AS year, count(*) AS rows, count(*) FILTER (WHERE rej='stale') AS stale
                  FROM cand WHERE rej IS NULL OR rej='stale' GROUP BY 1 ORDER BY 1""").fetchall():
                  print('  ', row)
              # --- final table: kept rows, score clamped 0..6, duplicates collapsed ---
              g = RULES['dedupe_grid_deg']
              # v4: a stale / name-rule / low-quality row stays in the file as SEARCH-ONLY (t=1): the seeder never offers it,
              # the host's name search still finds it. Only non-venues are dropped. Duplicates collapse across both tiers,
              # the offerable copy winning.
              con.execute(f"""
                CREATE OR REPLACE TABLE places AS
                SELECT id, name, lat, lon, address, locality, region, postcode, labels, bucket, website,
                       greatest(0, least(6, q_raw)) AS q, chain, ry, t
                FROM (
                  SELECT *, row_number() OVER (
                           PARTITION BY bucket, nname, round(lat / {g}), round(lon / {g})
                           ORDER BY t ASC, q_raw DESC, coalesce(ry, 0) DESC, length(address) DESC) AS rn
                  FROM (
                    SELECT *, regexp_replace(regexp_replace(regexp_replace(lower(name), '(bar[ -]?b[ -]?que|barbe?que|barbecue|bbq)', 'bbq', 'g'), '\\b(the|and|&|of|at|a|an)\\b', '', 'g'), '[^a-z0-9]', '', 'g') AS nname,
                           CASE WHEN rej IS NULL AND q_raw >= {floor_case} THEN 0 ELSE 1 END AS t
                    FROM cand WHERE rej IS NULL OR rej IN ('stale', 'name', 'vague')
                  )
                ) WHERE rn = 1
              """)
              total = con.execute("SELECT count(*) FROM places").fetchone()[0]
              offer = con.execute("SELECT count(*) FROM places WHERE t = 0").fetchone()[0]
              dups = con.execute("SELECT count(*) FROM cand WHERE rej IS NULL OR rej IN ('stale', 'name', 'vague')").fetchone()[0] - total
              print(f'\n== kept {total:,} places: {offer:,} offerable + {total-offer:,} search-only · {dups:,} duplicates collapsed · {time.time()-t0:.0f}s')
              print('== score distribution of the offerable rows (q → places)')
              for row in con.execute("SELECT q, count(*) FROM places WHERE t = 0 GROUP BY q ORDER BY q").fetchall(): print('  ', row)
              if os.environ.get('AUDIT_WEBSITES') == '1': audit_websites(con)
              con.execute(f"COPY (SELECT id, name, lat, lon, address, locality, region, postcode, labels, bucket, q, chain, ry, t FROM places) TO {q(os.path.join(workdir, 'us.csv'))} (HEADER, DELIMITER ',')")
              with open(os.path.join(workdir, 'count.txt'), 'w') as f: f.write(str(total))
              con.close()
              return total

          from huggingface_hub import HfApi, hf_hub_download
          dt = os.environ['DT']; repo = 'foursquare/fsq-os-places'
          token = os.environ.get('HF_TOKEN') or None
          prefix = f'release/dt={dt}/places/parquet'
          api = HfApi(token=token)
          files = sorted(f.path for f in api.list_repo_tree(repo, repo_type='dataset', path_in_repo=prefix) if f.path.endswith('.parquet'))
          assert files, f'no parquet files under {prefix}'
          print(len(files), 'parquet files in release', dt)
          def download(path):
              for attempt in range(4):
                  try: return hf_hub_download(repo, filename=path, repo_type='dataset', token=token, local_dir='/mnt/work/dl')
                  except Exception as e: print(f'  download retry {attempt+1} for {path}: {e}'); time.sleep(10 * (attempt + 1))
              sys.exit(f'could not download {path}')
          total = run(files, '/mnt/work', download=download)
          import shutil; shutil.copy('/mnt/work/us.csv', 'us.csv'); shutil.copy('/mnt/work/count.txt', 'count.txt')
          print(f'{total:,} places kept from release {dt}')
          PY
          rm -rf /mnt/work/dl

      - name: Convert to line-delimited GeoJSON
        run: |
          python3 - <<'PY'
          import csv, json, sys
          csv.field_size_limit(1 << 24)
          n = 0
          with open('us.csv', newline='', encoding='utf-8') as f, open('us.geojsonseq', 'w', encoding='utf-8') as out:
            for row in csv.DictReader(f):
              try: lat, lon = float(row['lat']), float(row['lon'])
              except: continue
              props = {k: row[k] for k in ('name', 'address', 'locality', 'region', 'postcode', 'labels', 'bucket', 'id') if row.get(k)}
              for k in ('q', 'chain', 'ry', 't'):
                try: props[k] = int(row[k])
                except: pass
              if props.get('t') == 0: del props['t']      # offerable is the default; only search-only rows carry t=1
              out.write(json.dumps({'type': 'Feature', 'properties': props, 'geometry': {'type': 'Point', 'coordinates': [round(lon, 6), round(lat, 6)]}}, ensure_ascii=False) + '\n')
              n += 1
          print(n, 'features written')
          PY
          rm -f us.csv

      - name: Build the tile file (z12 = everything; z10–11 = destinations only for wide searches)
        run: |
          set -e
          tippecanoe -o fsq-us.pmtiles -l place -n "Custom Welcome Book places" \
            -Z10 -z12 -r1 --no-feature-limit --no-tile-size-limit \
            -j '{"place":["any",[">=","$zoom",12],["in","bucket","park","museum","winery"]]}' \
            -P --force us.geojsonseq
          ls -la fsq-us.pmtiles
          rm -f us.geojsonseq

      - name: Manifest
        env:
          DT: ${{ steps.rel.outputs.dt }}
        run: |
          python3 - <<'PY'
          import json, os, time
          json.dump({'source': 'Foursquare OS Places (Apache-2.0) via huggingface.co/datasets/foursquare/fsq-os-places',
                     'release': os.environ['DT'], 'built': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                     'features': int(open('count.txt').read()), 'bytes': os.path.getsize('fsq-us.pmtiles'),
                     'rules': 4, 'zooms': {'12': 'all six categories', '10-11': 'park, museum, winery only'}},
                    open('manifest.json', 'w'), indent=2)
          print(open('manifest.json').read())
          PY

      - name: Publish as the "tiles" release (overwrites the previous file)
        run: |
          set -e
          gh release view tiles --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create tiles --repo "$GITHUB_REPOSITORY" --title "Places tiles" \
              --notes "Nearby-places tile file for Custom Welcome Book. Contains data from Foursquare OS Places (Apache License 2.0). Rebuilt monthly."
          gh release upload tiles fsq-us.pmtiles manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/download/tiles/fsq-us.pmtiles"
