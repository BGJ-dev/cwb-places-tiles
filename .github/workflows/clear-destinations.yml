# .github/workflows/clear-destinations.yml
#
# WAVE 1, STAGE 2 — turn the destinations list into the CLEARED layer.
#
# This does NOT talk to Wikidata. "Destinations update" already does that, it has been
# doing it correctly for weeks, and duplicating its queries would only mean maintaining
# two sets of QIDs. This reads that job's output and does the part it does not do:
#
#   1. a REAL draw number      twelve months of Wikipedia pageviews per place
#   2. the clearing gate       cleared_at set, or the place can never be suggested
#   3. the database            destinations.db, the D1 schema, with every source recorded
#
# Publishes to its own release tag ("destinations"). It cannot touch "tiles".
# Run "Destinations update" first if us-destinations.csv is stale.
name: Destinations clear (wave 1)

on:
  workflow_dispatch:
    inputs:
      pageviews:
        description: 'Fetch Wikipedia pageviews — the real draw number. Adds ~15 min. Off = clear on sitelinks alone.'
        type: boolean
        default: true
      min_views:
        description: 'Annual pageviews needed to clear (default 12000 = about 1,000 a month)'
        type: string
        default: '12000'
      pageview_budget_min:
        description: 'Minutes to spend fetching pageviews before stopping (the rest stay uncleared)'
        type: string
        default: '45'
      dry_run:
        description: 'Report only. Publishes nothing.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests

      - name: Take the destinations list from the tiles release
        run: |
          set -e
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/tiles/us-destinations.csv" -o us-destinations.csv
          wc -l us-destinations.csv
          head -2 us-destinations.csv

      - name: Twelve months of Wikipedia pageviews
        if: ${{ inputs.pageviews }}
        env:
          BUDGET_MIN: ${{ inputs.pageview_budget_min }}
        run: |
          python3 - <<'PY'
          import requests, csv, datetime, time, os, collections, threading
          import concurrent.futures as cf

          # Run #1 of this job got 33 answers out of 8,050 and could not say why, because the
          # fetch swallowed the status code. Twelve threads against an unauthenticated
          # Wikimedia endpoint is a burst, and a burst gets throttled. So: probe first and
          # print exactly what comes back, then go slowly, respect Retry-After, and tally
          # the failures by status so a bad run explains itself.
          UA = ('CustomWelcomeBook/1.0 (+https://github.com/BGJ-dev/cwb-places-tiles) '
                'python-requests')
          PV = ('https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/'
                'en.wikipedia/all-access/user/{t}/monthly/{a}/{b}')
          end   = datetime.date.today().replace(day=1)
          start = (end - datetime.timedelta(days=365)).replace(day=1)
          A, B = start.strftime('%Y%m%d00'), end.strftime('%Y%m%d00')

          rows = list(csv.DictReader(open('us-destinations.csv', encoding='utf-8')))
          print(f'{len(rows):,} destinations\n', flush=True)

          # ---- 0. probe: one known article, everything printed ----
          pr = requests.get(PV.format(t='Grand_Canyon', a=A, b=B),
                            headers={'User-Agent': UA}, timeout=45)
          print(f'== probe Grand_Canyon -> HTTP {pr.status_code}')
          for h in ('retry-after', 'x-ratelimit-remaining', 'content-type'):
              if h in pr.headers: print(f'   {h}: {pr.headers[h]}')
          print(f'   body: {pr.text[:220]}\n', flush=True)
          if pr.status_code != 200:
              raise SystemExit('the pageviews endpoint is not answering a known-good article — '
                               'nothing below will work; read the status above')

          # ---- 1. qid -> English Wikipedia title ----
          S = requests.Session(); S.headers['User-Agent'] = UA
          titles, ids = {}, [r['qid'] for r in rows]
          for i in range(0, len(ids), 50):
              try:
                  r = S.get('https://www.wikidata.org/w/api.php', timeout=60, params={
                      'action': 'wbgetentities', 'ids': '|'.join(ids[i:i+50]),
                      'props': 'sitelinks', 'sitefilter': 'enwiki', 'format': 'json'})
                  for q, e in (r.json().get('entities') or {}).items():
                      t = (e.get('sitelinks') or {}).get('enwiki', {}).get('title')
                      if t: titles[q] = t
              except Exception as e:
                  print(f'   titles at {i}: {type(e).__name__}', flush=True)
          print(f'{len(titles):,} of {len(rows):,} have an English Wikipedia article\n', flush=True)

          # ---- 2. views, politely, most-promising first ----
          # Descending sitelinks, so if we run out of time we have spent it on the places
          # most likely to clear. Everything unfetched simply stays uncleared, which is safe.
          sl = {r['qid']: int(r['sitelinks']) for r in rows}
          order = sorted(titles.items(), key=lambda kv: -sl.get(kv[0], 0))
          budget = float(os.environ.get('BUDGET_MIN') or 45) * 60
          t0 = time.time()
          codes = collections.Counter()
          got, lock, stop = {}, threading.Lock(), threading.Event()

          def one(item):
              q, t = item
              if stop.is_set(): return
              for attempt in range(3):
                  if time.time() - t0 > budget:
                      stop.set(); return
                  try:
                      r = requests.get(
                          PV.format(t=requests.utils.quote(t.replace(' ', '_'), safe=''), a=A, b=B),
                          headers={'User-Agent': UA}, timeout=45)
                  except Exception as e:
                      with lock: codes[type(e).__name__] += 1
                      time.sleep(2 + attempt * 3); continue
                  if r.status_code == 200:
                      m = [i['views'] for i in r.json().get('items', [])]
                      if not m:
                          with lock: codes['200-empty'] += 1
                          return
                      sm = sorted(m); med = sm[len(sm) // 2]
                      with lock:
                          codes[200] += 1
                          got[q] = (sum(m), round(max(m) / med, 1) if med else None)
                      return
                  if r.status_code in (429, 503):
                      wait = float(r.headers.get('retry-after') or (5 * (attempt + 1)))
                      with lock: codes[r.status_code] += 1
                      time.sleep(min(wait, 60)); continue
                  with lock: codes[r.status_code] += 1
                  return                                   # 404 and friends: the article has no data

          # four threads, not twelve. ~8,000 articles at roughly 8/s is about twenty minutes.
          with cf.ThreadPoolExecutor(max_workers=4) as ex:
              futs = [ex.submit(one, it) for it in order]
              for n, _ in enumerate(cf.as_completed(futs), 1):
                  if n % 500 == 0:
                      el = time.time() - t0
                      print(f'   {n:,}/{len(order):,} · {len(got):,} answered · {el/60:.1f} min · '
                            f'{dict(codes.most_common(4))}', flush=True)
          print(f'\n== {len(got):,} of {len(order):,} have a twelve-month view count'
                f' in {(time.time()-t0)/60:.1f} min')
          print(f'== responses by status: {dict(codes.most_common())}')
          if stop.is_set():
              print('== the time budget ran out; the rest stay uncleared, which is the safe side')

          for r in rows:
              t = got.get(r['qid'])
              r['enwiki'] = titles.get(r['qid'], '')
              r['views_12mo'] = t[0] if t else ''
              r['seasonality'] = t[1] if t and t[1] is not None else ''
          with open('us-destinations.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)
          PY

      - name: Clear, categorise, and build the database
        env:
          MIN_VIEWS: ${{ inputs.min_views }}
        run: |
          python3 - <<'PY'
          import csv, sqlite3, os, json, collections

          MIN_VIEWS = int(os.environ.get('MIN_VIEWS') or 12000)
          rows = list(csv.DictReader(open('us-destinations.csv', encoding='utf-8')))
          print(f'{len(rows):,} candidates · clearing bar: {MIN_VIEWS:,} views/yr\n')

          # "Destinations update" kind -> our guest-facing category.
          CAT = {
            'National Park':'outdoors','State Park':'outdoors','National Monument':'outdoors',
            'National Forest':'outdoors','Nature Preserve':'outdoors','Waterfall':'outdoors',
            # the NPS designations added to the puller on 2026-09-17
            'National Recreation Area':'outdoors','National Seashore':'outdoors',
            'National Preserve':'outdoors','National Scenic Trail':'outdoors',
            'Wildlife Refuge':'outdoors',
            'National Historical Park':'culture','National Historic Site':'culture',
            'National Memorial':'culture','National Battlefield':'culture',
            'Beach':'outdoors','Lake':'outdoors','Hot Spring':'outdoors','Canyon':'outdoors',
            'Mountain':'outdoors','Scenic Lookout':'outdoors','Botanical Garden':'outdoors',
            'Cave':'attraction','Zoo':'attraction','Aquarium':'attraction','Amusement Park':'attraction',
            'Tourist Attraction':'attraction',
            'Museum':'culture','Historic Site':'culture','Monument':'culture','Lighthouse':'culture',
            'Theater':'culture',
            'Winery':'maker','Brewery':'maker','Distillery':'maker',
          }
          # Deliberately not wave 1. A stadium is an event with a date; a ski area needs the
          # season field to be honest in print. Both are in the puller's output on purpose --
          # they are excluded HERE so the puller stays untouched and we can change our mind.
          NEVER = {'Stadium', 'Ski Area'}

          out, why = [], collections.Counter()
          for r in rows:
              kind = r['kind']
              if kind in NEVER:
                  why[f'not wave 1: {kind}'] += 1; continue
              cat = CAT.get(kind)
              if not cat:
                  why[f'no category for {kind}'] += 1; continue
              try: lat, lon = float(r['lat']), float(r['lon'])
              except ValueError:
                  why['bad coordinates'] += 1; continue
              views = int(r.get('views_12mo') or 0)
              sl = int(r['sitelinks'])
              # CONFIDENCE: independent things that vouch for this place.
              conf = 1 + (1 if r.get('enwiki') else 0) + (1 if r.get('locality') else 0)
              # DRAW is a measured number or it is nothing. We never manufacture one from
              # sitelinks and put it in the same column as real counts.
              draw  = views or None
              basis = 'wikipedia_pageviews_12mo' if views else None
              # NO MEASURED DRAW, NO CLEARANCE. Sitelinks are the thing we established do
              # not measure tourist draw: Mount Saint Elias and Novarupta both clear on
              # sitelinks and nobody day-trips to an Alaskan volcano, while Mount Rushmore
              # sits in the same class. Pageviews separate them; sitelinks cannot. A place
              # with no view count stays in the table as a candidate and is never suggested.
              cleared = (conf >= 2) and views >= MIN_VIEWS
              if not cleared:
                  why['no measured draw' if not views else 'below the bar'] += 1
              seas = r.get('seasonality')
              out.append({
                'id': 'wd:' + r['qid'], 'name': r['name'], 'lat': lat, 'lon': lon,
                'locality': r.get('locality',''), 'region': r.get('region',''),
                'cat': cat, 'kind': kind, 'wave': 1,
                'cleared_at': ('2026-09-17' if cleared else None),
                'cleared_by': ('rule:wave1-v1' if cleared else None),
                'draw': draw, 'draw_basis': basis, 'confidence': conf,
                'sitelinks': sl, 'seasonality': (float(seas) if seas else None),
                'official_url': '', 'wikidata_qid': r['qid'], 'enwiki': r.get('enwiki',''),
                'fsq_id': None,
              })

          cleared = [o for o in out if o['cleared_at']]
          measured = [o for o in cleared if o['draw']]
          withviews = sum(1 for o in out if o['draw'])
          if withviews < len(out) * 0.4:
              print(f'\n!! only {withviews:,} of {len(out):,} rows have a view count. The pageviews step')
              print('   did not do its job, and clearing on this would publish a hollow layer.')
              raise SystemExit('refusing to build a cleared layer without draw numbers')
          print(f'{len(out):,} candidates · {len(cleared):,} CLEARED ({len(measured):,} on a measured view count)')
          print('  set aside:', dict(why))
          print('\ncleared by category:', dict(collections.Counter(o['cat'] for o in cleared)))
          print('cleared by kind:    ', dict(collections.Counter(o['kind'] for o in cleared)))

          if measured:
              print('\n-- top 20 by measured draw --')
              for o in sorted(measured, key=lambda x: -x['draw'])[:20]:
                  print(f"   {o['draw']:10,d}  {o['cat']:10s} {o['name'][:44]:46s} {o['locality'][:24]}")
              print('\n-- 25 AT THE BAR. This is the list to eyeball: is the bar right? --')
              for o in sorted(measured, key=lambda x: x['draw'])[:25]:
                  print(f"   {o['draw']:10,d}  {o['cat']:10s} {o['name'][:44]:46s} {o['locality'][:24]}")
              print('\n-- 20 JUST BELOW the bar. What are we turning away? --')
              near = sorted([o for o in out if not o['cleared_at'] and o['draw']], key=lambda x: -x['draw'])[:20]
              for o in near:
                  print(f"   {o['draw']:10,d}  {o['cat']:10s} {o['name'][:44]:46s} {o['locality'][:24]}")
              print('\n-- most seasonal cleared places (peak month over median; print needs to know) --')
              for o in sorted([m for m in measured if m['seasonality']], key=lambda x: -x['seasonality'])[:12]:
                  print(f"   x{o['seasonality']:<5.1f} {o['cat']:10s} {o['name'][:44]:46s} {o['locality'][:24]}")

          if os.path.exists('destinations.db'): os.remove('destinations.db')
          db = sqlite3.connect('destinations.db')
          db.executescript('''
            CREATE TABLE places(
              id TEXT PRIMARY KEY, name TEXT NOT NULL, lat REAL, lon REAL,
              locality TEXT, region TEXT, cat TEXT, kind TEXT, wave INTEGER,
              cleared_at TEXT, cleared_by TEXT,
              draw INTEGER, draw_basis TEXT, confidence INTEGER, sitelinks INTEGER, seasonality REAL,
              official_url TEXT, wikidata_qid TEXT, enwiki TEXT, fsq_id TEXT);
            CREATE INDEX places_cleared ON places(cleared_at) WHERE cleared_at IS NOT NULL;
            CREATE INDEX places_geo ON places(lat, lon);
            CREATE TABLE place_sources(
              place_id TEXT, source TEXT, source_ref TEXT, observed_at TEXT, payload TEXT);
            CREATE INDEX place_sources_id ON place_sources(place_id);
          ''')
          cols = list(out[0].keys())
          db.executemany(f"INSERT INTO places({','.join(cols)}) VALUES({','.join('?'*len(cols))})",
                         [tuple(o[c] for c in cols) for o in out])
          src = []
          for o in out:
              src.append((o['id'], 'wikidata', o['wikidata_qid'], '2026-09-17',
                          json.dumps({'kind': o['kind'], 'sitelinks': o['sitelinks']})))
              if o['enwiki']:
                  src.append((o['id'], 'wikipedia_pageviews', o['enwiki'], '2026-09-17',
                              json.dumps({'views_12mo': o['draw'], 'seasonality': o['seasonality']})))
          db.executemany('INSERT INTO place_sources VALUES(?,?,?,?,?)', src)
          db.commit()
          print(f'\ndestinations.db — {len(out):,} places · {len(src):,} source rows')

          with open('destinations.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=cols); w.writeheader(); w.writerows(out)
          json.dump({'built': '2026-09-17', 'wave': 1,
                     'candidates': len(out), 'cleared': len(cleared), 'cleared_on_measured_draw': len(measured),
                     'bar': f'confidence>=2 AND (views>={MIN_VIEWS} OR sitelinks>=12)',
                     'by_cat': dict(collections.Counter(o['cat'] for o in cleared)),
                     'upstream': 'us-destinations.csv from the Destinations update job',
                     'sources': ['wikidata (CC0)', 'wikipedia pageviews']},
                    open('destinations-manifest.json', 'w'), indent=1)
          PY

      - name: Publish to the "destinations" release (its own tag)
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          gzip -f -9 -k destinations.csv
          gh release view destinations --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create destinations --repo "$GITHUB_REPOSITORY" --title "Cleared destinations (wave 1)" \
              --notes "The cleared layer. Nothing is suggested unless cleared_at is set."
          gh release upload destinations destinations.db destinations.csv.gz destinations-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          ls -la destinations.db destinations.csv.gz
