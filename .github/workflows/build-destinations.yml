name: Destinations update

# Custom Welcome Book — famous places ("destinations") from Wikidata, the free source of fame.
# For each kind of place a guest plans a day around (national parks, waterfalls, zoos, museums, historic
# sites, wineries…) this asks Wikidata for every item in the United States with coordinates and counts how
# many language Wikipedias write about it (sitelinks) — Disneyland ~90, Yosemite ~150, a county park 0.
# Output: us-destinations.csv on the "tiles" release. The places build ("Build places tiles") merges it as
# the destination bucket, so the seeder can offer a famous place an hour away. Wikidata is CC0.
# Runs monthly two days before the places build, and on demand. ~10–20 minutes; polite to the endpoint
# (one query at a time, a pause between, retries with backoff).

on:
  workflow_dispatch:
    inputs:
      discover:
        description: 'Look up Wikidata classes we might be missing, print candidates, and stop. ~1 min, publishes nothing.'
        type: boolean
        default: false
      sizing:
        description: 'Count how many places each class has at each sitelink floor, and look up the classes we are still missing. Prints numbers, publishes nothing. ~5 min.'
        type: boolean
        default: false
  schedule:
    - cron: '0 10 14 * *'

permissions:
  contents: write

jobs:
  destinations:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ask Wikidata, kind by kind
        env:
          DISCOVER: ${{ inputs.discover }}
          SIZING: ${{ inputs.sizing }}
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse, csv, sys, re, os
          UA = 'CustomWelcomeBook-destinations/1.0 (STR welcome books; github.com/BGJ-dev/cwb-places-tiles)'
          ENDPOINT = 'https://query.wikidata.org/sparql'
          # kind label → Wikidata classes (direct instance-of); '*' after a QID also walks subclasses (P279*)
          KINDS = [
            ('National Park',        ['Q46169']),
            ('Nature Preserve',      ['Q179049', 'Q1310307']),
            ('Waterfall',            ['Q34038']),
            ('Beach',                ['Q40080']),
            ('Lake',                 ['Q23397']),
            ('Cave',                 ['Q35509']),
            ('Hot Spring',           ['Q177380']),
            ('Canyon',               ['Q150784']),
            ('Mountain',             ['Q8502']),
            ('Scenic Lookout',       ['Q1440300', 'Q6017969']),
            ('Botanical Garden',     ['Q167346']),
            ('Zoo',                  ['Q43501']),
            ('Aquarium',             ['Q2281788']),
            ('Amusement Park',       ['Q194195', 'Q3467128']),
            ('Museum',               ['Q33506*']),
            ('Historic Site',        ['Q1081138', 'Q839954', 'Q23413']),
            ('Monument',             ['Q4989906']),
            ('Lighthouse',           ['Q39715']),
            ('Ski Area',             ['Q130003']),
            ('Winery',               ['Q156362']),
            ('Brewery',              ['Q131734']),
            ('Stadium',              ['Q483110']),
            ('Theater',              ['Q11635', 'Q24354']),
            ('Tourist Attraction',   ['Q570116']),
            # These four answered with ZERO for weeks — the QIDs were simply wrong, and a
            # zero is not a failure so nothing shouted about it. State parks were the biggest
            # hole in a day-trip layer: thousands of them, and we had none.
            # The QIDs below are not guesses: run #4's zero-report asked Wikidata what the
            # right class was and these came back with descriptions that name the US
            # explicitly. The old values are gone rather than kept alongside, because a QID
            # that returns nothing is just a wasted query.
            #   Q1761072  state park — protected area managed at the federated state level
            #             (walked with *, so per-state subclasses like "Oregon state park" come too)
            #   Q893775   National Monument of the United States
            #   Q612741   United States National Forest
            #   Q1251750  distillery — facility that manufactures alcoholic beverages
            ('State Park',           ['Q1761072*']),
            ('National Monument',    ['Q893775']),
            ('National Forest',      ['Q612741']),
            ('Distillery',           ['Q1251750']),
            # The NPS has about twenty designations and we were querying two, which is why
            # National Park returned 48 and LBJ National Historical Park was missing entirely.
            # These ten came out of the discovery run: every description below names the
            # United States, so none of them is a guess.
            #   Q15836337 National Historical Park — type of U.S. protected area
            #   Q1258086  National Historic Site — protected area in the United States
            #   Q1132998  National Recreation Area — type of protected area in the United States
            #   Q941043   United States National Seashore (lakeshores answer to this too)
            #   Q841646   national preserve — type of American protected area
            #   Q1967454  National Memorial of the United States
            #   Q35432882 National Battlefield — type of protected area in the United States
            #   Q12063557 National Scenic Trail — federally designated trail in the United States
            #   Q1410668  National Wildlife Refuge — type of federal conservation area in the US
            ('National Historical Park', ['Q15836337']),
            ('National Historic Site',   ['Q1258086']),
            ('National Recreation Area', ['Q1132998']),
            ('National Seashore',        ['Q941043']),
            ('National Preserve',        ['Q841646']),
            ('National Memorial',        ['Q1967454']),
            ('National Battlefield',     ['Q35432882']),
            ('National Scenic Trail',    ['Q12063557']),
            ('Wildlife Refuge',          ['Q1410668']),
          ]
          # THE FLOOR IS MEASURED, NOT GUESSED (2026-09-17).
          # It used to be MIN_SL = {Mountain: 6, Lake: 4, Theater: 4, Stadium: 4, Museum: 3},
          # base 2 -- numbers picked by hand back when sitelinks were the only quality signal
          # we had. They were never a quality gate; they were a guess, and they silently
          # removed real places (Olallie Lake, which English Wikipedia writes about and three
          # other languages do not). A model now reads every row, so sitelinks decide NOTHING
          # about what ships.
          # What the floor is FOR is keeping a single query inside what the endpoint will
          # answer. So it is now derived per class from a counting query: take the LOWEST
          # floor at which the class still fits under CLASS_CAP. Small classes get 0 and we
          # see everything; only a genuinely huge class is ever trimmed, and the log says so.
          CLASS_CAP = 30000      # rows we are willing to take from one class
          PAGE      = 10000      # rows per query; the pull pages until the class is exhausted
          FLOOR_STEPS = [0, 1, 2, 3, 4, 6, 8, 12]
          def sparql(q, tries=4):
            data = urllib.parse.urlencode({'query': q, 'format': 'json'}).encode()
            for a in range(tries):
              try:
                req = urllib.request.Request(ENDPOINT, data=data, headers={'User-Agent': UA, 'Accept': 'application/sparql-results+json'})
                with urllib.request.urlopen(req, timeout=90) as r: return json.load(r)['results']['bindings']
              except Exception as e:
                msg = str(e)[:120]; wait = 15 * (a + 1)
                print(f'      retry {a+1} in {wait}s — {msg}', flush=True); time.sleep(wait)
            return None
          def candidates(term, tries=4):
            """What QID does Wikidata think this class is? Prints, never adopts.
               The first discovery run got ten terms and then HTTPError'd on the rest:
               the search API throttles a steady trickle as readily as a burst, so this
               backs off and retries instead of giving up on the first refusal."""
            u = 'https://www.wikidata.org/w/api.php?' + urllib.parse.urlencode(
                  {'action': 'wbsearchentities', 'search': term, 'language': 'en',
                   'type': 'item', 'limit': 4, 'format': 'json'})
            for a in range(tries):
              try:
                req = urllib.request.Request(u, headers={'User-Agent': UA})
                with urllib.request.urlopen(req, timeout=30) as r: return json.load(r).get('search', [])
              except Exception as e:
                if a == tries - 1:
                  print(f'      (lookup failed after {tries} tries: {type(e).__name__} {str(e)[:60]})')
                  return []
                time.sleep(5 * (a + 1))
            return []

          # A class-based pull leaks, because Wikidata's typing is inconsistent. Proof: THE
          # ALAMO is not in our file under any name — the most-visited site in Texas — while
          # the Minnesota, Arizona and Iowa capitols are in as "Museum" and the Texas one is
          # not in at all. Also missing: San Antonio River Walk, Natural Bridge Caverns,
          # Schlitterbahn, Gruene. And the NPS has about twenty designations; we query two,
          # which is why National Park returns 48 and LBJ National Historical Park is absent.
          # This step does not guess. It asks Wikidata what each class is called and prints
          # the candidates, so the QIDs get read by a human before they go in.
          WANTED = [
            'national historical park', 'national historic site', 'national recreation area',
            'national seashore', 'national lakeshore', 'national preserve', 'national memorial',
            'national battlefield', 'national scenic trail', 'national wildlife refuge',
            'show cave', 'water park', 'historic district', 'World Heritage Site',
            'Spanish mission in the Americas', 'fort', 'observation deck', 'planetarium',
            'science museum', 'arboretum', 'scenic byway', 'pedestrian street',
            'state historic site', 'county park', 'reservoir', 'wilderness area',
          ]
          def count_by_floor(path, qid):
            """How many US items with coordinates does this class have at each floor?
               ONE aggregate query per class -- no rows come back, so it is cheap and it
               cannot truncate. Returns {floor: count} or None if the endpoint refused."""
            sums = ' '.join(f'(SUM(IF(?sl >= {f}, 1, 0)) AS ?f{f})' for f in FLOOR_STEPS)
            q = f'''SELECT {sums} WHERE {{
              ?item {path} wd:{qid} ; wdt:P17 wd:Q30 ; wdt:P625 ?coord ; wikibase:sitelinks ?sl .
            }}'''
            r = sparql(q)
            if not r: return None
            b = r[0]
            return {f: int(b[f'f{f}']['value']) for f in FLOOR_STEPS if f'f{f}' in b}

          def pick_floor(counts):
            """The lowest floor that fits under the cap. 0 whenever the class is small enough."""
            for f in FLOOR_STEPS:
              if counts.get(f, 10**9) <= CLASS_CAP: return f
            return FLOOR_STEPS[-1]

          if os.environ.get('SIZING') == 'true':
            print('== sizing run -- counting only. Nothing is pulled and nothing is published.\n')
            print(f'   cap per class: {CLASS_CAP:,}\n')
            hdr = 'class'.ljust(26) + ''.join(f'>={f}'.rjust(9) for f in FLOOR_STEPS) + '   floor'
            print(hdr); print('-' * len(hdr))
            tot_now, tot_new = 0, 0
            for kind, classes in KINDS:
              for cls in classes:
                walk = cls.endswith('*'); qid = cls.rstrip('*')
                path = 'wdt:P31/wdt:P279*' if walk else 'wdt:P31'
                c = count_by_floor(path, qid)
                if c is None:
                  print(f'{(kind + " " + cls)[:26].ljust(26)}  (the endpoint did not answer)')
                  time.sleep(2); continue
                f = pick_floor(c)
                print(f'{(kind + " " + cls)[:26].ljust(26)}' + ''.join(f'{c.get(x,0):,}'.rjust(9) for x in FLOOR_STEPS) + f'   >={f}')
                tot_now += c.get(2, 0); tot_new += c.get(f, 0)
                time.sleep(2)
            print(f'\n== at the OLD base floor of 2 these classes hold {tot_now:,} rows.')
            print(f'== at the measured floors they hold {tot_new:,}. That number sizes the judging run.')
            print('\n-- and the classes we are still missing --')
            for term in WANTED[10:]:
              print(f'  {term}')
              for h in candidates(term):
                print(f"      {h['id']:11s} {h.get('label','')[:38]:40s} {h.get('description','')[:64]}")
              time.sleep(3)
            print('\n== done. Nothing was pulled and nothing was published.')
            sys.exit(0)

          if os.environ.get('DISCOVER') == 'true':
            print('== class discovery — nothing is pulled or published\n')
            for term in WANTED:
              print(f'  {term}')
              for h in candidates(term):
                print(f"      {h['id']:11s} {h.get('label','')[:38]:40s} {h.get('description','')[:64]}")
              time.sleep(3)
            print('\n== done. Pick the QIDs that say "United States" or match the intent, and add them to KINDS.')
            sys.exit(0)

          seen = {}; report = []
          for kind, classes in KINDS:
            got = 0
            for cls in classes:
              walk = cls.endswith('*'); qid = cls.rstrip('*')
              path = 'wdt:P31/wdt:P279*' if walk else 'wdt:P31'
              # Count first, then choose the floor from the count. A small class gets 0 and we
              # take everything it has. If the counting query will not answer, fall back to 2 --
              # the old base -- and say so, rather than guessing something new.
              counts = count_by_floor(path, qid)
              if counts is None:
                minsl = 2; print(f'      {kind} {qid}: no count, using the old floor of 2', flush=True)
              else:
                minsl = pick_floor(counts)
                print(f'      {kind} {qid}: {counts.get(0,0):,} in all, floor >={minsl} takes {counts.get(minsl,0):,}', flush=True)
              # PAGED, AND ORDERED. The old query was a bare LIMIT 20000 with no ORDER BY: if a
              # class ever exceeded it we got an arbitrary 20,000 rows and no error at all.
              rows, off = [], 0
              while True:
                q = f'''SELECT ?item ?itemLabel ?coord ?sl ?adminLabel WHERE {{
                  ?item {path} wd:{qid} ; wdt:P17 wd:Q30 ; wdt:P625 ?coord ; wikibase:sitelinks ?sl .
                  FILTER(?sl >= {minsl})
                  OPTIONAL {{ ?item wdt:P131 ?admin . }}
                  SERVICE wikibase:label {{ bd:serviceParam wikibase:language "en" . }}
                }} ORDER BY ?item LIMIT {PAGE} OFFSET {off}'''
                page = sparql(q)
                if page is None and walk and off == 0:        # the subclass walk timed out: fall back to direct instances
                  page = sparql(q.replace('wdt:P31/wdt:P279*', 'wdt:P31'))
                if page is None:
                  if off == 0: rows = None
                  break
                rows.extend(page); off += PAGE
                if len(page) < PAGE or off >= CLASS_CAP: break
                time.sleep(1.5)
              if rows is None: report.append((kind, qid, 'FAILED')); continue
              n = 0
              for b in rows:
                item = b['item']['value'].rsplit('/', 1)[-1]
                m = re.match(r'Point\(([-\d.]+) ([-\d.]+)\)', b['coord']['value'])
                if not m: continue
                name = b.get('itemLabel', {}).get('value', '')
                if not name or name == item: continue             # no English label → not a place a guest will know
                sl = int(b['sl']['value']); lon, lat = float(m.group(1)), float(m.group(2))
                if not (24 <= lat <= 72 and -180 <= lon <= -65): continue   # US bounds incl. Alaska/Hawaii; drops stray coordinates
                # THE FIRST KIND WINS. This used to keep whichever copy of the row carried more
                # sitelinks, which let fame decide what KIND a place was filed under -- a thing
                # sitelinks have no bearing on. KINDS is ordered most-specific-first, so the
                # first class to claim an item is the right one (a National Park that is also
                # typed as a Mountain stays a National Park).
                if item not in seen:
                  seen[item] = {'qid': item, 'name': name[:80], 'lat': round(lat, 5), 'lon': round(lon, 5), 'kind': kind, 'sitelinks': sl, 'locality': b.get('adminLabel', {}).get('value', '')[:60], 'region': ''}
                  n += 1
              got += n; report.append((kind, qid, n)); time.sleep(1.5)
            print(f'  {kind:20s} {got:6d}', flush=True)
          # Ordered by name. It used to be ordered by sitelinks, which made the file itself
          # a fame ranking -- so any truncation anywhere downstream quietly kept the famous
          # ones and dropped the rest. Nothing downstream should read order as meaning.
          rows = sorted(seen.values(), key=lambda r: (r['kind'], r['name']))
          with open('us-destinations.csv', 'w', newline='', encoding='utf-8') as f:
            w = csv.DictWriter(f, fieldnames=['qid', 'name', 'lat', 'lon', 'kind', 'sitelinks', 'locality', 'region']); w.writeheader()
            for r in rows: w.writerow(r)
          print(f'\n== {len(rows):,} destinations written; by kind:')
          byk = {}
          for r in rows: byk[r['kind']] = byk.get(r['kind'], 0) + 1
          for k, v in sorted(byk.items(), key=lambda x: -x[1]): print(f'   {k:20s} {v:6d}')
          print('\n== queries that failed (kind, class):', [x for x in report if x[2] == 'FAILED'] or 'none')
          # A class that answers with ZERO is not a failure and slides past unnoticed. Four of
          # them have: State Park, National Monument, National Forest and Distillery have been
          # returning nothing for weeks, and state parks are the biggest hole in a day-trip
          # layer. Name them, and ask Wikidata what the right QID would have been.
          zero = sorted({k for k, q, n in report if n == 0} - {k for k, q, n in report if isinstance(n, int) and n > 0})
          if zero:
            print('\n== !! CLASSES THAT RETURNED ZERO — almost certainly the wrong QID:')
            for kind in zero:
              qids = [q for k, q, n in report if k == kind]
              print(f'   {kind}  (asked for {", ".join(qids)})')
              for h in candidates(kind):
                print(f"      candidate {h['id']:10s} {h.get('label','')} — {h.get('description','')[:64]}")
              time.sleep(1)
          else:
            print('\n== every class returned at least one row')
          print('\n== a sample of 30, evenly spread through the file (NOT a ranking):')
          step = max(1, len(rows) // 30)
          for r in rows[::step][:30]: print(f'   {r["sitelinks"]:4d} sl  {r["name"]}  ({r["kind"]}, {r["locality"]})')
          assert len(rows) > 1000, 'too few destinations — the queries are not answering; the previous release file stays'
          PY

      - name: Publish next to the tiles
        run: |
          gh release view tiles --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create tiles --repo "$GITHUB_REPOSITORY" --title "Places tiles" --notes "Built by the workflows in this repo."
          gh release upload tiles us-destinations.csv --repo "$GITHUB_REPOSITORY" --clobber
          echo "published us-destinations.csv"
