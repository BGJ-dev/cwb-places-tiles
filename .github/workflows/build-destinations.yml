name: Destinations update

# Custom Welcome Book — famous places ("destinations") from Wikidata, the free source of fame.
# For each kind of place a guest plans a day around (national parks, waterfalls, zoos, museums, historic
# sites, wineries…) this asks Wikidata for every item in the United States with coordinates and counts how
# many language Wikipedias write about it (sitelinks) — Disneyland ~90, Yosemite ~150, a county park 0.
# Output: us-destinations.csv on the "tiles" release. The places build ("Build places tiles") merges it as
# the destination bucket, so the seeder can offer a famous place an hour away. Wikidata is CC0.
# Runs monthly two days before the places build, and on demand. ~10–20 minutes; polite to the endpoint
# (one query at a time, a pause between, retries with backoff).

on:
  workflow_dispatch:
    inputs:
      discover:
        description: 'Look up Wikidata classes we might be missing, print candidates, and stop. ~1 min, publishes nothing.'
        type: boolean
        default: false
      sizing:
        description: 'Count how many places each class has at each sitelink floor, and look up the classes we are still missing. Prints numbers, publishes nothing. ~5 min.'
        type: boolean
        default: false
  schedule:
    - cron: '0 10 14 * *'

permissions:
  contents: write

jobs:
  destinations:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ask Wikidata, kind by kind
        env:
          DISCOVER: ${{ inputs.discover }}
          SIZING: ${{ inputs.sizing }}
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse, csv, sys, re, os
          UA = 'CustomWelcomeBook-destinations/1.0 (STR welcome books; github.com/BGJ-dev/cwb-places-tiles)'
          ENDPOINT = 'https://query.wikidata.org/sparql'
          # kind label → Wikidata classes (direct instance-of); '*' after a QID also walks subclasses (P279*)
          KINDS = [
            ('National Park',        ['Q46169']),
            ('Nature Preserve',      ['Q179049', 'Q1310307']),
            ('Waterfall',            ['Q34038']),
            ('Beach',                ['Q40080']),
            ('Lake',                 ['Q23397']),
            ('Cave',                 ['Q35509']),
            ('Hot Spring',           ['Q177380']),
            ('Canyon',               ['Q150784']),
            ('Mountain',             ['Q8502']),
            ('Scenic Lookout',       ['Q1440300', 'Q6017969']),
            ('Botanical Garden',     ['Q167346']),
            ('Zoo',                  ['Q43501']),
            ('Aquarium',             ['Q2281788']),
            ('Amusement Park',       ['Q194195', 'Q3467128']),
            ('Museum',               ['Q33506*']),
            ('Historic Site',        ['Q1081138', 'Q839954', 'Q23413']),
            ('Monument',             ['Q4989906']),
            ('Lighthouse',           ['Q39715']),
            ('Ski Area',             ['Q130003']),
            ('Winery',               ['Q156362']),
            ('Brewery',              ['Q131734']),
            ('Stadium',              ['Q483110']),
            ('Theater',              ['Q11635', 'Q24354']),
            ('Tourist Attraction',   ['Q570116']),
            # These four answered with ZERO for weeks — the QIDs were simply wrong, and a
            # zero is not a failure so nothing shouted about it. State parks were the biggest
            # hole in a day-trip layer: thousands of them, and we had none.
            # The QIDs below are not guesses: run #4's zero-report asked Wikidata what the
            # right class was and these came back with descriptions that name the US
            # explicitly. The old values are gone rather than kept alongside, because a QID
            # that returns nothing is just a wasted query.
            #   Q1761072  state park — protected area managed at the federated state level
            #             (walked with *, so per-state subclasses like "Oregon state park" come too)
            #   Q893775   National Monument of the United States
            #   Q612741   United States National Forest
            #   Q1251750  distillery — facility that manufactures alcoholic beverages
            ('State Park',           ['Q1761072*']),
            ('National Monument',    ['Q893775']),
            ('National Forest',      ['Q612741']),
            ('Distillery',           ['Q1251750']),
            # The NPS has about twenty designations and we were querying two, which is why
            # National Park returned 48 and LBJ National Historical Park was missing entirely.
            # These ten came out of the discovery run: every description below names the
            # United States, so none of them is a guess.
            #   Q15836337 National Historical Park — type of U.S. protected area
            #   Q1258086  National Historic Site — protected area in the United States
            #   Q1132998  National Recreation Area — type of protected area in the United States
            #   Q941043   United States National Seashore (lakeshores answer to this too)
            #   Q841646   national preserve — type of American protected area
            #   Q1967454  National Memorial of the United States
            #   Q35432882 National Battlefield — type of protected area in the United States
            #   Q12063557 National Scenic Trail — federally designated trail in the United States
            #   Q1410668  National Wildlife Refuge — type of federal conservation area in the US
            ('National Historical Park', ['Q15836337']),
            ('National Historic Site',   ['Q1258086']),
            ('National Recreation Area', ['Q1132998']),
            ('National Seashore',        ['Q941043']),
            ('National Preserve',        ['Q841646']),
            ('National Memorial',        ['Q1967454']),
            ('National Battlefield',     ['Q35432882']),
            ('National Scenic Trail',    ['Q12063557']),
            ('Wildlife Refuge',          ['Q1410668']),
            # Fifteen classes from the 2026-09-17 sizing run's discovery pass. Every
            # description below was read before the QID went in; none is a guess, and the
            # one term that came back empty (Spanish mission) is in WANTED, not here.
            #   Q2232001  show cave -- cave made accessible to the general public
            #   Q740326   water park -- recreational facility with water attractions
            #   Q15243209 historic district -- section of a city with older buildings
            #   Q9259     World Heritage Site -- listed by UNESCO
            #   Q1785071  fort -- military construction for defensive warfare
            #   Q177305   observation deck -- elevated sightseeing platform
            #   Q148319   planetarium
            #   Q588140   science museum (also reachable under Museum's subclass walk)
            #   Q272231   arboretum (also reachable under Botanical Garden)
            #   Q1406331  scenic route -- designated path, road or waterway of interest
            #   Q62685721 pedestrian street -- street reserved mainly for pedestrians
            #   Q28042933 state historic site in the United States
            #   Q5177940  county park -- park managed by a county
            #   Q131681   reservoir -- artificial lake impounded by a dam
            #   Q27995042 United States Wilderness Area -- congressionally designated
            ('Show Cave',            ['Q2232001']),
            ('Water Park',           ['Q740326']),
            ('Historic District',    ['Q15243209']),
            ('World Heritage Site',  ['Q9259']),
            ('Fort',                 ['Q1785071']),
            ('Observation Deck',     ['Q177305']),
            ('Planetarium',          ['Q148319']),
            ('Science Museum',       ['Q588140']),
            ('Arboretum',            ['Q272231']),
            ('Scenic Route',         ['Q1406331']),
            ('Pedestrian Street',    ['Q62685721']),
            ('State Historic Site',  ['Q28042933']),
            ('County Park',          ['Q5177940']),
            ('Reservoir',            ['Q131681']),
            ('Wilderness Area',      ['Q27995042']),
            # From the second sizing run (2026-09-17). Q106695446 is THE ANSWER TO OLALLIE:
            # Olallie Scenic Area is instance of "scenic area", a class we had never asked for,
            # which is why it was absent -- not the sitelink floor I blamed at first.
            #   Q106695446 scenic area -- area where a person can experience scenic beauty
            #   Q6978245   National Scenic Area -- conservation designation used in the US
            #   Q2324919   state forest -- government owned forest
            #   Q113033132 state recreation area
            # NOT added, deliberately: "protected area" (Q473972) is too broad to reason about
            # yet, and every "Spanish mission" hit was an OVERVIEW ARTICLE, not a class you can
            # be an instance of. The recall report on the real pull will say what the Alamo and
            # the missions actually are, and then they go in with evidence instead of a guess.
            ('Scenic Area',          ['Q106695446']),
            ('National Scenic Area', ['Q6978245']),
            ('State Forest',         ['Q2324919']),
            ('State Recreation Area',['Q113033132']),
          ]
          # MOUNTAIN, LAKE AND BEACH ARE NOT LIKE THE OTHERS (2026-09-17, measured).
          # 90% of Mountain, 70% of Lake and 88% of Beach are items with exactly one
          # sitelink -- the signature of bot-made stubs, one article per named hill and
          # pond in a government feature database. At floor 0 those three alone are 97,260
          # rows against 24,284 for every other class combined.
          # Raising their sitelink floor would be selecting by fame again, and it is worse
          # than it looks: "Olallie Lake" (Q107373479) is a DISAMBIGUATION PAGE carrying two
          # sitelinks, English and Cebuano -- and the Cebuano Wikipedia is ~99% bot-written.
          # A sitelink count on a geographic feature substantially measures whether one bot's
          # source list included it.
          # So these three get a rule that means something instead: the item must carry an
          # image or an official website. A human bothered. Olallie Scenic Area (Q3350146)
          # carries an image; a nameless pond does not.
          # MEASURED 2026-09-17, second sizing run. The rule is doing exactly what it should:
          #   Mountain  65,580 -> 3,660      Lake  29,194 -> 1,589      Beach  2,486 -> 348
          # and with it in place THE CAP BOUND ON NOTHING. Every class is taken whole at floor
          # zero; no sitelink count decides anything anywhere in this file any more.
          # That same run exposed two more classes with the bot-stub shape, so they get the
          # same rule:
          #   Reservoir          8,007 rows, 80% of them carrying exactly one sitelink --
          #                      a nameless impoundment with no photo and no website is not
          #                      somewhere a guest drives to.
          #   Historic District 11,314 rows, 46% at exactly one sitelink, and the single
          #                      largest class in the pull. LESS CLEAR-CUT than the others:
          #                      American historic districts are legitimately English-only.
          #                      So this one is a judgement I am making with an instrument
          #                      behind it -- the recall list holds the French Quarter,
          #                      Charleston, Old Town Albuquerque and Gruene, and if the rule
          #                      cuts too deep the recall report will name them as misses.
          # READ, 2026-09-17, because Brandon asked for the deletes to be sampled and checked
          # before 62,000 rows went in the bin. 150 dropped names read by hand. The rule holds
          # on three classes and FAILS on two:
          #
          #   Lake      KEEP THE RULE. Dropped: Coon Lake, Catfish Lake, Mill Pond, Pitcher
          #             Lake, Mardow Lake (Yukon-Koyukuk Census Area). Nameless ponds, exactly
          #             as intended. 29,194 -> 1,589.
          #   Mountain  KEEP THE RULE. Dropped: Beech Hill, Beede Hill, Spencer Hill, Kunde
          #             Knoll, Kurn Hattin Hill -- GNIS hills. Kept: Cadillac Mountain,
          #             Electric Peak, Campbell Hill. 65,580 -> 3,660.
          #   Reservoir KEEP THE RULE. Dropped: "Monte Vista Poultry Detention Pond", Dunlap
          #             Pond, Brewer Reservoir. It also drops Lake Mineral Wells and Lake
          #             Minatare -- but those are STATE PARKS and arrive under that class, so
          #             the destination is not lost, only the impoundment row. 8,007 -> 1,079.
          #
          #   Beach     RULE KEPT -- after I first removed it and Brandon overturned that.
          #             I had read the dropped list, recognised Ho'okena, Second Beach and
          #             Moonstone Beach as real places, and called the rule broken. He asked
          #             what those ROWS actually are. Checked, one by one:
          #               Ho'okena beach -- a 300-word stub about a declined port village,
          #                 "now known for a beach park", no photo. The destination is the
          #                 PARK, which has no Wikipedia article at all.
          #               Second Beach -- "Second Beach" is a DISAMBIGUATION page; the Olympic
          #                 one is a trail destination inside Olympic National Park, and the
          #                 park is already in the pull.
          #               Moonstone Beach -- an article about REDONDO BEACH's former tourism
          #                 era, not the Cambria destination I had assumed from the name.
          #             Three for three: the rule was dropping thin feature stubs, and where a
          #             real destination was involved it arrives under another class. I had
          #             judged the rows by whether the NAME sounded like somewhere real.
          #   Historic  RULE REMOVED, but the class stays -- gated on renown instead, which is
          #   District  the ONE place in this file where a sitelink count is still legitimate,
          #             and only because Brandon's product rule for this class IS about renown:
          #             "if a historic district is worth visiting, there will be enough
          #             attractions within the district to draw attention to it. Naming the
          #             district itself would compete with the actual destinations... It would
          #             be good to keep the really famous or noteworthy districts, like The
          #             French Quarter." A district earns a slot only when naming it beats
          #             naming what is inside it, and that is exactly what many languages
          #             writing about it measures. At >= 6 sitelinks the class goes 11,314 ->
          #             101. The image rule was no use here anyway: it cut 16% arbitrarily,
          #             dropping Clarksdale and Danville while keeping three South Main Streets.
          _HUMAN_BOTHERED = '{ ?item wdt:P18 ?img } UNION { ?item wdt:P856 ?site }'
          EXTRA = { 'Mountain': _HUMAN_BOTHERED, 'Lake': _HUMAN_BOTHERED,
                    'Beach': _HUMAN_BOTHERED, 'Reservoir': _HUMAN_BOTHERED }
          # The one surviving sitelink gate, for the one class whose product rule is renown.
          # Everywhere else in this file sitelinks decide nothing.
          FLOOR_OVERRIDE = { 'Historic District': 6 }
          # THE FLOOR IS MEASURED, NOT GUESSED (2026-09-17).
          # It used to be MIN_SL = {Mountain: 6, Lake: 4, Theater: 4, Stadium: 4, Museum: 3},
          # base 2 -- numbers picked by hand back when sitelinks were the only quality signal
          # we had. They were never a quality gate; they were a guess, and they silently
          # removed real places (Olallie Lake, which English Wikipedia writes about and three
          # other languages do not). A model now reads every row, so sitelinks decide NOTHING
          # about what ships.
          # What the floor is FOR is keeping a single query inside what the endpoint will
          # answer. So it is now derived per class from a counting query: take the LOWEST
          # floor at which the class still fits under CLASS_CAP. Small classes get 0 and we
          # see everything; only a genuinely huge class is ever trimmed, and the log says so.
          CLASS_CAP = 30000      # rows we are willing to take from one class
          PAGE      = 10000      # rows per query; the pull pages until the class is exhausted
          FLOOR_STEPS = [0, 1, 2, 3, 4, 6, 8, 12]
          def sparql(q, tries=4):
            data = urllib.parse.urlencode({'query': q, 'format': 'json'}).encode()
            for a in range(tries):
              try:
                req = urllib.request.Request(ENDPOINT, data=data, headers={'User-Agent': UA, 'Accept': 'application/sparql-results+json'})
                with urllib.request.urlopen(req, timeout=90) as r: return json.load(r)['results']['bindings']
              except Exception as e:
                msg = str(e)[:120]; wait = 15 * (a + 1)
                print(f'      retry {a+1} in {wait}s — {msg}', flush=True); time.sleep(wait)
            return None
          def candidates(term, tries=4):
            """What QID does Wikidata think this class is? Prints, never adopts.
               The first discovery run got ten terms and then HTTPError'd on the rest:
               the search API throttles a steady trickle as readily as a burst, so this
               backs off and retries instead of giving up on the first refusal."""
            u = 'https://www.wikidata.org/w/api.php?' + urllib.parse.urlencode(
                  {'action': 'wbsearchentities', 'search': term, 'language': 'en',
                   'type': 'item', 'limit': 4, 'format': 'json'})
            for a in range(tries):
              try:
                req = urllib.request.Request(u, headers={'User-Agent': UA})
                with urllib.request.urlopen(req, timeout=30) as r: return json.load(r).get('search', [])
              except Exception as e:
                if a == tries - 1:
                  print(f'      (lookup failed after {tries} tries: {type(e).__name__} {str(e)[:60]})')
                  return []
                time.sleep(5 * (a + 1))
            return []

          # A class-based pull leaks, because Wikidata's typing is inconsistent. Proof: THE
          # ALAMO is not in our file under any name — the most-visited site in Texas — while
          # the Minnesota, Arizona and Iowa capitols are in as "Museum" and the Texas one is
          # not in at all. Also missing: San Antonio River Walk, Natural Bridge Caverns,
          # Schlitterbahn, Gruene. And the NPS has about twenty designations; we query two,
          # which is why National Park returns 48 and LBJ National Historical Park is absent.
          # This step does not guess. It asks Wikidata what each class is called and prints
          # the candidates, so the QIDs get read by a human before they go in.
          WANTED = [
            'national historical park', 'national historic site', 'national recreation area',
            'national seashore', 'national lakeshore', 'national preserve', 'national memorial',
            'national battlefield', 'national scenic trail', 'national wildlife refuge',
            'show cave', 'water park', 'historic district', 'World Heritage Site',
            'Spanish mission in the Americas', 'fort', 'observation deck', 'planetarium',
            'science museum', 'arboretum', 'scenic byway', 'pedestrian street',
            'state historic site', 'county park', 'reservoir', 'wilderness area',
            # still owed after the 2026-09-17 sizing run: "Spanish mission in the Americas"
            # returned nothing, and Olallie Scenic Area showed us two classes we never asked
            # for at all. Every one of these is a known hole, not a hunch.
            'Spanish mission', 'mission complex', 'scenic area', 'protected area',
            'national scenic area', 'state forest', 'state natural area', 'state recreation area',
          ]
          def count_by_floor(path, qid, extra=''):
            """How many US items with coordinates does this class have at each floor?
               ONE aggregate query per class -- no rows come back, so it is cheap and it
               cannot truncate. Returns {floor: count} or None if the endpoint refused."""
            sums = ' '.join(f'(SUM(IF(?sl >= {f}, 1, 0)) AS ?f{f})' for f in FLOOR_STEPS)
            ex = f'  {extra} .' if extra else ''
            q = f'''SELECT {sums} WHERE {{
              ?item {path} wd:{qid} ; wdt:P17 wd:Q30 ; wdt:P625 ?coord ; wikibase:sitelinks ?sl .
            {ex}
            }}'''
            r = sparql(q)
            if not r: return None
            b = r[0]
            return {f: int(b[f'f{f}']['value']) for f in FLOOR_STEPS if f'f{f}' in b}

          def sample_excluded(kind, path, qid, rule, n_all, n_kept):
            """SHOW WHAT THE RULE THROWS AWAY. An exclusion rule that nobody has read the
               output of is a guess with a number attached -- the same mistake as the sitelink
               floor. So for every class carrying a rule, print a spread sample of the rows it
               DROPS and a few it KEEPS, and let a human read the names."""
            dropped = n_all - n_kept
            print(f'\n   --- {kind}: {n_all:,} in all, KEEPS {n_kept:,}, DROPS {dropped:,} '
                  f'({dropped*100//max(n_all,1)}%) ---', flush=True)
            if dropped <= 0:
              print('       nothing dropped.'); return
            def grab(neg, count, label):
              seen_names = []
              spots = [0] if count <= 30 else [0, count // 3, (2 * count) // 3]
              for off in spots:
                clause = (f'FILTER NOT EXISTS {{ {rule} }}' if neg else f'{rule} .')
                q = f'''SELECT ?item ?itemLabel ?sl ?adminLabel WHERE {{
                  ?item {path} wd:{qid} ; wdt:P17 wd:Q30 ; wdt:P625 ?coord ; wikibase:sitelinks ?sl .
                  {clause}
                  OPTIONAL {{ ?item wdt:P131 ?admin . }}
                  SERVICE wikibase:label {{ bd:serviceParam wikibase:language "en" . }}
                }} ORDER BY ?item LIMIT 10 OFFSET {off}'''
                r = sparql(q)
                if not r: continue
                for b in r:
                  nm = b.get('itemLabel', {}).get('value', '')
                  if not nm or nm.startswith('Q'): continue
                  seen_names.append((nm, int(b['sl']['value']),
                                     b.get('adminLabel', {}).get('value', '')[:28]))
                time.sleep(1.5)
              print(f'       {label}:')
              for nm, sl, loc in seen_names[:30]:
                print(f'         {sl:3d} sl  {nm[:52]:54s} {loc}')
              if not seen_names: print('         (the endpoint did not answer)')
            grab(True,  dropped, 'DROPPED by the rule -- read these, they are the ones at risk')
            grab(False, n_kept,  'KEPT, for contrast')

          def pick_floor(counts):
            """The lowest floor that fits under the cap. 0 whenever the class is small enough."""
            for f in FLOOR_STEPS:
              if counts.get(f, 10**9) <= CLASS_CAP: return f
            return FLOOR_STEPS[-1]

          # THE RECALL LIST. A class-enumerated pull LEAKS, because Wikidata's typing is
          # inconsistent: the Alamo, the San Antonio River Walk, Natural Bridge Caverns,
          # Gruene and Olallie Scenic Area are all absent, each for its own class reason.
          # Adding a class every time a human notices a gap is not a method -- it depends on
          # somebody spotting the hole. So the run scores itself: these are places a welcome
          # book should be able to suggest, and every run prints the ones it did not find,
          # WITH what Wikidata says they are, so a miss arrives as a to-do rather than a mood.
          # It is a test set. It is allowed to be opinionated, and Brandon edits it freely.
          RECALL = [
            'The Alamo', 'San Antonio River Walk',
            'Natural Bridge Caverns', 'Gruene Historic District',
            'Schlitterbahn', 'Olallie Scenic Area',
            'Lyndon B. Johnson National Historical Park', 'Bracken Cave',
            'Grand Canyon National Park', 'Yellowstone National Park',
            'Zion National Park', 'Acadia National Park',
            'Crater Lake National Park', 'Great Smoky Mountains National Park',
            'Rocky Mountain National Park', 'Everglades National Park',
            'Joshua Tree National Park', 'Carlsbad Caverns National Park',
            'Mount Rushmore National Memorial', 'Statue of Liberty',
            'Independence Hall', 'Gettysburg National Military Park',
            'Fort Sumter National Historical Park', 'Monticello',
            'Mount Vernon', 'Graceland',
            'Biltmore Estate', 'Hearst Castle',
            'Taliesin West', 'Fallingwater',
            'Mission San Xavier del Bac', 'San Antonio Missions National Historical Park',
            'Cahokia Mounds', 'Mesa Verde National Park',
            'Taos Pueblo', 'Mammoth Cave National Park',
            'Luray Caverns', 'Meramec Caverns',
            'Ruby Falls', 'Howe Caverns',
            'Niagara Falls State Park', 'Multnomah Falls',
            'Havasu Falls', 'Cannon Beach',
            'Cape Hatteras National Seashore', 'Lake Tahoe',
            'Crystal River', 'Hanauma Bay',
            'Pikes Peak', 'Smith Rock State Park',
            'Enchanted Rock State Natural Area', 'Devils Tower National Monument',
            'Garden of the Gods', 'Stone Mountain Park',
            'Chimney Rock State Park', 'Metropolitan Museum of Art',
            'Art Institute of Chicago', 'Country Music Hall of Fame and Museum',
            'The Getty Center', 'Kennedy Space Center Visitor Complex',
            'Space Center Houston', 'National Air and Space Museum',
            'Isabella Stewart Gardner Museum', 'Crystal Bridges Museum of American Art',
            'Adler Planetarium', 'Exploratorium',
            'Corning Museum of Glass', 'San Diego Zoo',
            'Monterey Bay Aquarium', 'Georgia Aquarium',
            'Longwood Gardens', 'Dallas Arboretum and Botanical Garden',
            'Fort Worth Botanic Garden', 'Cedar Point',
            'Dollywood', 'Silver Dollar City',
            'Disneyland', 'Universal Orlando Resort',
            'Kalahari Resorts Wisconsin Dells', "Noah's Ark Water Park",
            'Blue Ridge Parkway', 'Going-to-the-Sun Road',
            'Route 66', 'Pearl Street Mall',
            'Church Street Marketplace', 'French Quarter',
            'Charleston Historic District', 'Old Town Albuquerque',
            'The High Line', 'Millennium Park',
            'Biltmore Winery', "Jack Daniel's Distillery",
            'Buffalo Trace Distillery', "Maker's Mark Distillery",
            'Sierra Nevada Brewing Co.', 'Napa Valley Wine Train',
            'Hoʻokena Beach Park', 'Cape Disappointment State Park',
            'Siesta Key Beach', 'Coronado Beach',
            'Lake Chelan', 'Flathead Lake',
            'Lake Powell', 'Lake Mead National Recreation Area',
            'French Quarter', 'Vieux Carre Historic District',
            "Jacob's Well Natural Area", 'Hamilton Pool Preserve',
            'Blanco State Park', 'Wimberley Blue Hole Regional Park',
            'Palo Duro Canyon State Park', 'Caddo Lake State Park',
            'Turner Falls Park', 'Beavers Bend State Park',
            'Silver Falls State Park', 'Painted Hills',
            'Lava River Cave', 'Sunriver Nature Center',
            'High Desert Museum', 'Tumalo Falls',
          ]

          def recall_report(found_names):
            norm = lambda x: re.sub(r'[^a-z0-9]+', ' ', x.lower()).strip()
            have = {norm(n) for n in found_names}
            hits, misses = [], []
            for want in RECALL:
              w = norm(want)
              # A substring match on a SHORT name is a false positive waiting to happen --
              # "Monticello" would claim a hit on "Monticello Dam" and hide a real miss. So a
              # substring only counts when the shorter of the two is long enough to be
              # distinctive; anything shorter has to match exactly.
              def near(h):
                if w == h: return True
                short = min(len(w), len(h))
                return short >= 12 and (w in h or h in w)
              (hits if any(near(h) for h in have) else misses).append(want)
            print(f'\n== RECALL: {len(hits)}/{len(RECALL)} of the places a book should be able to'
                  f' suggest are in this pull ({len(hits)*100//max(len(RECALL),1)}%)')
            if not misses:
              print('   nothing missing.'); return
            # Cap the interrogation. Each miss costs two polite queries and a pause; a run
            # that went badly wrong would otherwise spend ten minutes explaining itself to us
            # one row at a time. Forty is plenty to see the pattern.
            LOOKUP = 40
            print(f'\n   {len(misses)} MISSING -- and what Wikidata says each one is:')
            if len(misses) > LOOKUP:
              print(f'   (looking up the first {LOOKUP}; the rest are listed by name at the end)')
            for m in misses[:LOOKUP]:
              hit = candidates(m)
              if not hit:
                print(f'   {m:46s} (Wikidata has no obvious item -- check the name)')
              else:
                h = hit[0]
                cls = sparql(f'SELECT ?cLabel WHERE {{ wd:{h["id"]} wdt:P31 ?c . '
                             f'SERVICE wikibase:label {{ bd:serviceParam wikibase:language "en" . }} }}')
                kinds = ', '.join(sorted({b['cLabel']['value'] for b in (cls or [])})) or '(no instance-of)'
                print(f'   {m:46s} {h["id"]:11s} instance of: {kinds}')
              time.sleep(1.2)
            if len(misses) > LOOKUP:
              print(f'\n   also missing, not looked up: {", ".join(misses[LOOKUP:])}')
            print('\n   Each line above is either a class to add to KINDS, or a place that is'
                  '\n   genuinely not in Wikidata and needs another source.')

          if os.environ.get('SIZING') == 'true':
            print('== sizing run -- counting only. Nothing is pulled and nothing is published.\n')
            print(f'   cap per class: {CLASS_CAP:,}\n')
            hdr = 'class'.ljust(26) + ''.join(f'>={f}'.rjust(9) for f in FLOOR_STEPS) + '   floor'
            print(hdr); print('-' * len(hdr))
            tot_now, tot_new, capped = 0, 0, []
            for kind, classes in KINDS:
              for cls in classes:
                walk = cls.endswith('*'); qid = cls.rstrip('*')
                path = 'wdt:P31/wdt:P279*' if walk else 'wdt:P31'
                c = count_by_floor(path, qid, EXTRA.get(kind, ''))
                if c is None:
                  print(f'{(kind + " " + cls)[:26].ljust(26)}  (the endpoint did not answer)')
                  time.sleep(2); continue
                f = FLOOR_OVERRIDE.get(kind) or pick_floor(c)
                mark = ('  (renown gate, by design)' if kind in FLOOR_OVERRIDE
                        else '  <<< CAP BINDS' if f > 0 else '')
                if kind in EXTRA: mark += '  (image-or-website rule applied)'
                print(f'{(kind + " " + cls)[:26].ljust(26)}' + ''.join(f'{c.get(x,0):,}'.rjust(9) for x in FLOOR_STEPS) + f'   >={f}{mark}')
                if f > 0 and kind not in FLOOR_OVERRIDE:
                  capped.append((kind, cls, c.get(0, 0), c.get(f, 0), f))
                tot_now += c.get(2, 0); tot_new += c.get(f, 0)
                time.sleep(2)
            # THE SANITY CHECK ON THE EXCLUSION RULES. Brandon asked for it by name, and he
            # was right to: 62,000 rows were about to be dropped on a rule nobody had read the
            # output of. This prints what each rule keeps and what it throws away.
            print('\n\n== WHAT THE IMAGE-OR-WEBSITE RULE ACTUALLY DROPS')
            print('   (the rule: the Wikidata item must carry an image (P18) or an official'
                  '\n    website (P856) -- evidence a human bothered with the place)')
            for kind, classes in KINDS:
              rule = EXTRA.get(kind)
              if not rule: continue
              for cls in classes:
                walk = cls.endswith('*'); qid = cls.rstrip('*')
                path = 'wdt:P31/wdt:P279*' if walk else 'wdt:P31'
                c_all  = count_by_floor(path, qid, '')
                c_keep = count_by_floor(path, qid, rule)
                if c_all is None or c_keep is None:
                  print(f'\n   --- {kind}: the endpoint did not answer ---'); continue
                sample_excluded(kind, path, qid, rule, c_all.get(0, 0), c_keep.get(0, 0))

            print(f'\n\n== at the OLD base floor of 2 these classes hold {tot_now:,} rows.')
            print(f'== at the measured floors they hold {tot_new:,}. That number sizes the judging run.')
            # A CAP THAT TRUNCATES SILENTLY IS A FILTER PRETENDING TO BE PLUMBING. When it
            # binds, raising the sitelink floor is selecting by fame -- the exact thing this
            # rebuild removed. So say so, loudly, and let a human decide what that class holds.
            if capped:
              print('\n!! THE CAP BOUND ON THESE CLASSES. Raising a sitelink floor to fit a cap IS')
              print('!! selecting by fame. Do not accept these silently -- decide what the class holds:')
              for k, cl, all_n, kept, f in capped:
                print(f'   {k:24s} {all_n:9,} in all -> kept {kept:,} at floor >={f}'
                      f'  (DROPPED {all_n-kept:,})')
            else:
              print('\n== the cap bound on nothing. Every class is taken whole at floor 0.')
            print('\n-- recall against the current KINDS list (names only; a real pull scores properly) --')
            print('   skipped in sizing mode: the counting queries return no names. Run the real')
            print('   pull to score recall.')
            print('\n-- and the classes we are still missing --')
            for term in WANTED[10:]:
              print(f'  {term}')
              for h in candidates(term):
                print(f"      {h['id']:11s} {h.get('label','')[:38]:40s} {h.get('description','')[:64]}")
              time.sleep(3)
            print('\n== done. Nothing was pulled and nothing was published.')
            sys.exit(0)

          if os.environ.get('DISCOVER') == 'true':
            print('== class discovery — nothing is pulled or published\n')
            for term in WANTED:
              print(f'  {term}')
              for h in candidates(term):
                print(f"      {h['id']:11s} {h.get('label','')[:38]:40s} {h.get('description','')[:64]}")
              time.sleep(3)
            print('\n== done. Pick the QIDs that say "United States" or match the intent, and add them to KINDS.')
            sys.exit(0)

          seen = {}; report = []
          for kind, classes in KINDS:
            got = 0
            for cls in classes:
              walk = cls.endswith('*'); qid = cls.rstrip('*')
              path = 'wdt:P31/wdt:P279*' if walk else 'wdt:P31'
              # Count first, then choose the floor from the count. A small class gets 0 and we
              # take everything it has. If the counting query will not answer, fall back to 2 --
              # the old base -- and say so, rather than guessing something new.
              extra = EXTRA.get(kind, '')
              counts = count_by_floor(path, qid, extra)
              if counts is None:
                minsl = 2; print(f'      {kind} {qid}: no count, using the old floor of 2', flush=True)
              else:
                minsl = FLOOR_OVERRIDE.get(kind) or pick_floor(counts)
                note = '  <<< CAP BINDS, fame is deciding here' if minsl > 0 else ''
                print(f'      {kind} {qid}: {counts.get(0,0):,} in all, floor >={minsl} takes {counts.get(minsl,0):,}{note}', flush=True)
              # PAGED, AND ORDERED. The old query was a bare LIMIT 20000 with no ORDER BY: if a
              # class ever exceeded it we got an arbitrary 20,000 rows and no error at all.
              rows, off = [], 0
              while True:
                q = f'''SELECT ?item ?itemLabel ?coord ?sl ?adminLabel WHERE {{
                  ?item {path} wd:{qid} ; wdt:P17 wd:Q30 ; wdt:P625 ?coord ; wikibase:sitelinks ?sl .
                  {(extra + ' .') if extra else ''}
                  FILTER(?sl >= {minsl})
                  OPTIONAL {{ ?item wdt:P131 ?admin . }}
                  SERVICE wikibase:label {{ bd:serviceParam wikibase:language "en" . }}
                }} ORDER BY ?item LIMIT {PAGE} OFFSET {off}'''
                page = sparql(q)
                if page is None and walk and off == 0:        # the subclass walk timed out: fall back to direct instances
                  page = sparql(q.replace('wdt:P31/wdt:P279*', 'wdt:P31'))
                if page is None:
                  if off == 0: rows = None
                  break
                rows.extend(page); off += PAGE
                if len(page) < PAGE or off >= CLASS_CAP: break
                time.sleep(1.5)
              if rows is None: report.append((kind, qid, 'FAILED')); continue
              n = 0
              for b in rows:
                item = b['item']['value'].rsplit('/', 1)[-1]
                m = re.match(r'Point\(([-\d.]+) ([-\d.]+)\)', b['coord']['value'])
                if not m: continue
                name = b.get('itemLabel', {}).get('value', '')
                if not name or name == item: continue             # no English label → not a place a guest will know
                sl = int(b['sl']['value']); lon, lat = float(m.group(1)), float(m.group(2))
                if not (24 <= lat <= 72 and -180 <= lon <= -65): continue   # US bounds incl. Alaska/Hawaii; drops stray coordinates
                # THE FIRST KIND WINS. This used to keep whichever copy of the row carried more
                # sitelinks, which let fame decide what KIND a place was filed under -- a thing
                # sitelinks have no bearing on. KINDS is ordered most-specific-first, so the
                # first class to claim an item is the right one (a National Park that is also
                # typed as a Mountain stays a National Park).
                if item not in seen:
                  seen[item] = {'qid': item, 'name': name[:80], 'lat': round(lat, 5), 'lon': round(lon, 5), 'kind': kind, 'sitelinks': sl, 'locality': b.get('adminLabel', {}).get('value', '')[:60], 'region': ''}
                  n += 1
              got += n; report.append((kind, qid, n)); time.sleep(1.5)
            print(f'  {kind:20s} {got:6d}', flush=True)
          # Ordered by name. It used to be ordered by sitelinks, which made the file itself
          # a fame ranking -- so any truncation anywhere downstream quietly kept the famous
          # ones and dropped the rest. Nothing downstream should read order as meaning.
          rows = sorted(seen.values(), key=lambda r: (r['kind'], r['name']))
          with open('us-destinations.csv', 'w', newline='', encoding='utf-8') as f:
            w = csv.DictWriter(f, fieldnames=['qid', 'name', 'lat', 'lon', 'kind', 'sitelinks', 'locality', 'region']); w.writeheader()
            for r in rows: w.writerow(r)
          print(f'\n== {len(rows):,} destinations written; by kind:')
          byk = {}
          for r in rows: byk[r['kind']] = byk.get(r['kind'], 0) + 1
          for k, v in sorted(byk.items(), key=lambda x: -x[1]): print(f'   {k:20s} {v:6d}')
          print('\n== queries that failed (kind, class):', [x for x in report if x[2] == 'FAILED'] or 'none')
          # A class that answers with ZERO is not a failure and slides past unnoticed. Four of
          # them have: State Park, National Monument, National Forest and Distillery have been
          # returning nothing for weeks, and state parks are the biggest hole in a day-trip
          # layer. Name them, and ask Wikidata what the right QID would have been.
          zero = sorted({k for k, q, n in report if n == 0} - {k for k, q, n in report if isinstance(n, int) and n > 0})
          if zero:
            print('\n== !! CLASSES THAT RETURNED ZERO — almost certainly the wrong QID:')
            for kind in zero:
              qids = [q for k, q, n in report if k == kind]
              print(f'   {kind}  (asked for {", ".join(qids)})')
              for h in candidates(kind):
                print(f"      candidate {h['id']:10s} {h.get('label','')} — {h.get('description','')[:64]}")
              time.sleep(1)
          else:
            print('\n== every class returned at least one row')
          recall_report([r['name'] for r in rows])
          print('\n== a sample of 30, evenly spread through the file (NOT a ranking):')
          step = max(1, len(rows) // 30)
          for r in rows[::step][:30]: print(f'   {r["sitelinks"]:4d} sl  {r["name"]}  ({r["kind"]}, {r["locality"]})')
          assert len(rows) > 1000, 'too few destinations — the queries are not answering; the previous release file stays'
          PY

      - name: Publish next to the tiles
        run: |
          gh release view tiles --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create tiles --repo "$GITHUB_REPOSITORY" --title "Places tiles" --notes "Built by the workflows in this repo."
          gh release upload tiles us-destinations.csv --repo "$GITHUB_REPOSITORY" --clobber
          echo "published us-destinations.csv"
