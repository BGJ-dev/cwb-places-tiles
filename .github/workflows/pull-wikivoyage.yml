# .github/workflows/pull-wikivoyage.yml
#
# WAVE 2 — pull every United States listing out of English Wikivoyage.
#
# What it does: downloads the current Wikivoyage database file (the public dump), finds every page
# that sits under "United States of America" in Wikivoyage's own page tree, extracts every listing
# (see, do, eat, drink, buy, sleep) with its name, address, coordinates, website, Wikidata id,
# last-edit date and the editor's description, prints a nationwide count, and publishes three files
# to a release called "wave2". It decides nothing and changes nothing else in this repository.
#
# Why here: the Cowork workspace cannot reach Wikimedia's servers. A GitHub runner can.
# Licence: Wikivoyage text is CC BY-SA 4.0. The release notes carry the attribution.
name: Wave 2 — pull Wikivoyage (US)

on:
  workflow_dispatch:
    inputs:
      dump_url:
        description: 'Wikivoyage dump to read (leave as-is for the current one)'
        required: false
        default: 'https://dumps.wikimedia.org/enwikivoyage/latest/enwikivoyage-latest-pages-articles.xml.bz2'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the Wikivoyage dump
        env:
          DUMP_URL: ${{ inputs.dump_url }}
        run: |
          curl -sSL --retry 3 --retry-delay 10 -o dump.xml.bz2 "$DUMP_URL"
          ls -la dump.xml.bz2

      - name: Extract every US listing and count them
        run: |
          python3 - <<'PY'
          import bz2, re, sys, os, csv, gzip, json, collections, datetime
          import xml.etree.ElementTree as ET

          DUMP = sys.argv[1] if len(sys.argv) > 1 else 'dump.xml.bz2'
          OUT = sys.argv[2] if len(sys.argv) > 2 else 'out'
          os.makedirs(OUT, exist_ok=True)
          LISTING_TYPES = {'see', 'do', 'eat', 'drink', 'buy', 'sleep', 'go', 'listing'}
          STATES = {'Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','Florida',
           'Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland',
           'Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire',
           'New Jersey','New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania',
           'Rhode Island','South Carolina','South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington',
           'West Virginia','Wisconsin','Wyoming','Washington, D.C.'}
          USA = 'United States of America'
          NAME_RE = re.compile(r'\s*([A-Za-z][A-Za-z ]*?)\s*(\||\}\})')
          ISPART = re.compile(r'\{\{\s*(?:ispartof|isin)\s*\|\s*([^}|]+)', re.I)
          STATUS = re.compile(r'\{\{\s*(outline|usable|guide|star)\s*(city|district|park|ruralarea|region|country|airport|topic|itinerary|diveguide|continent|event)\s*[|}]', re.I)
          GEO = re.compile(r'\{\{\s*geo\s*\|\s*(-?[\d.]+)\s*\|\s*(-?[\d.]+)', re.I)
          SECTION = re.compile(r'^(==+)\s*([^=]+?)\s*\1\s*$', re.M)

          def norm_title(t):
              t = (t or '').replace('_', ' ').strip()
              return t[:1].upper() + t[1:] if t else t

          def find_templates(text):
              """Every listing template, nesting-aware: returns (name, body) for the outermost listing templates."""
              out, i, n = [], 0, len(text)
              while True:
                  j = text.find('{{', i)
                  if j < 0: break
                  m = NAME_RE.match(text, j + 2)
                  if not m or m.group(1).strip().lower() not in LISTING_TYPES:
                      i = j + 2; continue
                  depth, p, end = 0, j, None
                  while p < n:
                      if text.startswith('{{', p): depth += 1; p += 2; continue
                      if text.startswith('}}', p):
                          depth -= 1; p += 2
                          if depth == 0: end = p; break
                          continue
                      p += 1
                  if end is None: break
                  out.append((m.group(1).strip().lower(), text[j + 2:end - 2]))
                  i = end
              return out

          def split_fields(body):
              parts, cur, dt, dl, i, n = [], [], 0, 0, 0, len(body)
              while i < n:
                  two = body[i:i + 2]
                  if two == '{{': dt += 1; cur.append(two); i += 2; continue
                  if two == '}}': dt -= 1; cur.append(two); i += 2; continue
                  if two == '[[': dl += 1; cur.append(two); i += 2; continue
                  if two == ']]': dl -= 1; cur.append(two); i += 2; continue
                  ch = body[i]
                  if ch == '|' and dt == 0 and dl == 0:
                      parts.append(''.join(cur)); cur = []; i += 1; continue
                  cur.append(ch); i += 1
              parts.append(''.join(cur))
              fields = {}
              for p in parts[1:]:
                  if '=' in p:
                      k, v = p.split('=', 1)
                      fields[k.strip().lower()] = v.strip()
              return fields

          def clean(s):
              s = re.sub(r'<!--.*?-->', '', s or '', flags=re.S)
              s = re.sub(r'<ref[^>]*/>|<ref[^>]*>.*?</ref>', '', s, flags=re.S)
              s = re.sub(r'\[\[(?:[^|\]]*\|)?([^\]]*)\]\]', r'\1', s)
              s = re.sub(r'\[(?:https?://\S+)\s+([^\]]+)\]', r'\1', s)
              s = re.sub(r'\{\{[^{}]*\}\}', '', s)
              s = re.sub(r"'{2,}", '', s)
              s = re.sub(r'<[^>]+>', '', s)
              return re.sub(r'\s+', ' ', s).strip()

          def untemplated_bullets(text):
              """Count '*' bullet lines with no listing template inside See/Do/Eat/Drink sections (free-text listings)."""
              heads = [(m.start(), m.group(2).strip().lower()) for m in SECTION.finditer(text)]
              heads.append((len(text), ''))
              c = 0
              for (a, name), (b, _) in zip(heads, heads[1:]):
                  if name.split()[0:1] and name.split()[0] in ('see', 'do', 'eat', 'drink'):
                      for line in text[a:b].split('\n'):
                          if line.startswith('*') and '{{' not in line: c += 1
              return c

          pages, redirects, listings = {}, {}, []
          opener = bz2.open if DUMP.endswith('.bz2') else open
          with opener(DUMP, 'rb') as fh:
              title = ns = ts = redir = text = None
              for ev, el in ET.iterparse(fh, events=('end',)):
                  tag = el.tag.rsplit('}', 1)[-1]
                  if tag == 'title': title = el.text or ''
                  elif tag == 'ns': ns = el.text
                  elif tag == 'redirect': redir = el.get('title')
                  elif tag == 'timestamp': ts = el.text
                  elif tag == 'text': text = el.text or ''
                  elif tag == 'page':
                      if ns == '0' and title:
                          t = norm_title(title)
                          if redir:
                              redirects[t] = norm_title(redir)
                          else:
                              m = ISPART.search(text or '')
                              st = STATUS.search(text or '')
                              g = GEO.search(text or '')
                              ls = find_templates(text or '')
                              pages[t] = {'parent': norm_title(m.group(1)) if m else '',
                                          'status': st.group(1).lower() if st else '',
                                          'ptype': st.group(2).lower() if st else '',
                                          'lat': g.group(1) if g else '', 'lon': g.group(2) if g else '',
                                          'rev': (ts or '')[:10], 'n': len(ls), 'free': untemplated_bullets(text or '')}
                              for nm, body in ls:
                                  f = split_fields('x|' + body)
                                  typ = nm if nm != 'listing' else (f.get('type', 'listing').lower() or 'listing')
                                  name = clean(f.get('name', ''))
                                  if not name: continue
                                  listings.append({'page': t, 'type': typ, 'name': name, 'alt': clean(f.get('alt', '')),
                                      'address': clean(f.get('address', '')), 'directions': clean(f.get('directions', '')),
                                      'lat': f.get('lat', '').strip(), 'long': (f.get('long', '') or f.get('lon', '')).strip(),
                                      'url': f.get('url', '').strip(), 'phone': re.sub(r'[^0-9+]', '', f.get('phone', '')),
                                      'hours': clean(f.get('hours', '')), 'wikidata': f.get('wikidata', '').strip(),
                                      'wikipedia': clean(f.get('wikipedia', '')), 'lastedit': f.get('lastedit', '').strip(),
                                      'content': clean(f.get('content', '') or f.get('description', ''))})
                      title = ns = ts = redir = text = None
                      el.clear()

          def resolve(t):
              seen = 0
              while t in redirects and seen < 5: t = redirects[t]; seen += 1
              return t

          def us_state(t):
              chain, cur = [], resolve(t)
              for _ in range(40):
                  if not cur or cur in chain: break
                  chain.append(cur)
                  if cur == USA: break
                  cur = resolve(pages.get(cur, {}).get('parent', ''))
              if USA not in chain: return None
              for c in chain:
                  base = re.sub(r'\s*\((?:U\.S\. )?state\)$', '', c)
                  if base in STATES: return base
              return ''

          state_of = {}
          for t in pages:
              s = us_state(t)
              if s is not None: state_of[t] = s
          us = [l for l in listings if l['page'] in state_of]
          for l in us:
              p = pages[l['page']]
              l.update({'state': state_of[l['page']], 'page_status': p['status'], 'page_type': p['ptype'], 'page_rev': p['rev']})

          cols = ['page','state','page_status','page_type','page_rev','type','name','alt','address','directions','lat','long',
                  'url','phone','hours','wikidata','wikipedia','lastedit','content']
          with gzip.open(os.path.join(OUT, 'wikivoyage-us-listings.csv.gz'), 'wt', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=cols); w.writeheader(); w.writerows(us)
          with gzip.open(os.path.join(OUT, 'wikivoyage-us-pages.csv.gz'), 'wt', newline='', encoding='utf-8') as f:
              w = csv.writer(f); w.writerow(['title','state','status','type','lat','lon','parent','rev','templated_listings','free_text_bullets'])
              for t, s in sorted(state_of.items()):
                  p = pages[t]; w.writerow([t, s, p['status'], p['ptype'], p['lat'], p['lon'], p['parent'], p['rev'], p['n'], p['free']])

          # ------------------------------------------------------------------ the nationwide count
          L = []
          def say(x=''): print(x); L.append(x)
          say('=' * 78); say('WIKIVOYAGE — UNITED STATES, NATIONWIDE COUNT'); say('=' * 78)
          say(f'pages in the dump (articles, not redirects): {len(pages):,}')
          say(f'US pages: {len(state_of):,}   with at least one templated listing: {sum(1 for t in state_of if pages[t]["n"]):,}')
          say(f'US pages by status: {dict(collections.Counter(pages[t]["status"] or "none" for t in state_of).most_common())}')
          say(f'US listings: {len(us):,}'); tc = collections.Counter(l["type"] for l in us)
          say(f'  by type: {dict(tc.most_common())}')
          core = [l for l in us if l['type'] in ('see', 'do', 'eat', 'drink')]
          def pct(a, b): return f'{a:,} ({a * 100 // max(b, 1)}%)'
          say(f'see/do/eat/drink: {len(core):,}')
          say(f'  with coordinates : {pct(sum(1 for l in core if l["lat"] and l["long"]), len(core))}')
          say(f'  with an address  : {pct(sum(1 for l in core if l["address"]), len(core))}')
          say(f'  with a website   : {pct(sum(1 for l in core if l["url"]), len(core))}')
          say(f'  with a Wikidata id: {pct(sum(1 for l in core if l["wikidata"]), len(core))}')
          say(f'  with a description: {pct(sum(1 for l in core if l["content"]), len(core))}')
          YEAR = re.compile(r'\d{4}')
          n_le = sum(1 for l in core if YEAR.match(l['lastedit'] or ''))
          say(f'  with a last-edit date: {pct(n_le, len(core))}')
          yrs = collections.Counter((l['lastedit'] or '')[:4] for l in core if YEAR.match(l['lastedit'] or ''))
          say(f'  last-edit year: {dict(sorted(yrs.items()))}')
          say(f'free-text bullets (listings not in a template) on US pages: {sum(pages[t]["free"] for t in state_of):,}')
          say('\nsee/do/eat/drink listings by state:')
          bs = collections.Counter(l['state'] or '(no state)' for l in core)
          for s, c in bs.most_common(): say(f'  {s:<22} {c:>6,}')
          say('=' * 78)
          import random
          random.seed(7)
          say('\n20 random US see/do/eat/drink listings, for eyeballing:')
          for l in random.sample(core, min(20, len(core))):
              say(f"  [{l['type']}] {l['name']} — {l['page']}, {l['state']} · edited {l['lastedit'] or '?'} · {'xy' if l['lat'] else 'no xy'} · {l['content'][:70]}")
          open(os.path.join(OUT, 'summary.txt'), 'w').write('\n'.join(L) + '\n')

          PY
          ls -la out

      - name: Publish to the "wave2" release
        run: |
          set -e
          gh release view wave2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create wave2 --repo "$GITHUB_REPOSITORY" --title "Wave 2 — Wikivoyage (US)" \
              --notes "Listings extracted from the English Wikivoyage database dump (https://en.wikivoyage.org). Wikivoyage content is licensed CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/). These files are shared under the same licence, with attribution to the Wikivoyage contributors."
          gh release upload wave2 out/wikivoyage-us-listings.csv.gz out/wikivoyage-us-pages.csv.gz out/summary.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
