# .github/workflows/flags-probe.yml
#
# One-off, read-only probe. Builds nothing, publishes nothing, touches no release.
# Answers one question: is Foursquare's `unresolved_flags` column worth trusting?
#
# Run it from the Actions tab. ~6-8 minutes. Safe to run while the build is frozen.
name: flags probe (read-only)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'How many parquet shards to read (each ~3-4 min). 2 is enough to decide.'
        default: '2'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install duckdb huggingface_hub

      - name: Probe
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'PY'
          import duckdb, os, json, urllib.request
          from huggingface_hub import HfApi, hf_hub_download

          api = HfApi(); repo = 'foursquare/fsq-os-places'
          rels = sorted(f.path.split('dt=')[-1].strip('/')
                        for f in api.list_repo_tree(repo, repo_type='dataset', path_in_repo='release'))
          dt = rels[-1]
          print(f'release {dt}   (all releases seen: {rels[-3:]})', flush=True)
          prefix = f'release/dt={dt}/places/parquet'
          files = sorted(f.path for f in api.list_repo_tree(repo, repo_type='dataset', path_in_repo=prefix)
                         if f.path.endswith('.parquet'))
          n = int(os.environ.get('SHARDS') or 2)
          files = files[:n]
          print(f'{len(files)} of the release shards\n', flush=True)

          local = [hf_hub_download(repo, f, repo_type='dataset') for f in files]
          con = duckdb.connect()
          q = lambda p: "'" + p.replace("'", "''") + "'"
          SRC = 'read_parquet([' + ','.join(q(p) for p in local) + '])'

          # ---------- 0. what the column actually is ----------
          cols = con.execute(f'DESCRIBE SELECT * FROM {SRC}').fetchall()
          print('== schema')
          for c in cols: print(f'   {c[0]:28s} {c[1]}')
          names = [c[0] for c in cols]
          if 'unresolved_flags' not in names:
              print('\n!! unresolved_flags is NOT in this release. Nothing further to test.'); raise SystemExit(0)
          typ = dict((c[0], c[1]) for c in cols)['unresolved_flags']
          print(f'\n== unresolved_flags type: {typ}')
          arr = typ.strip().upper().endswith('[]') or 'LIST' in typ.upper()
          FLAT = (f"SELECT fsq_place_id AS id, name, locality, region, date_closed, website, "
                  f"date_refreshed, fsq_category_labels, "
                  f"{'unnest(unresolved_flags)' if arr else 'unresolved_flags'} AS flag FROM {SRC}")
          ANY  = (f"SELECT *, {'len(coalesce(unresolved_flags, []))>0' if arr else 'unresolved_flags IS NOT NULL'} "
                  f"AS has_flag FROM {SRC}")
          con.execute(f'CREATE TABLE us AS SELECT * FROM ({ANY}) WHERE country = \'US\'')
          tot = con.execute('SELECT count(*) FROM us').fetchone()[0]
          print(f'US rows in these shards: {tot:,}')

          # ---------- 1. coverage: how often, and which values ----------
          flagged = con.execute('SELECT count(*) FROM us WHERE has_flag').fetchone()[0]
          print(f'\n== 1. COVERAGE')
          print(f'   rows carrying at least one flag: {flagged:,} ({flagged/tot*100:.2f}%)')
          con.execute(f"CREATE TABLE fl AS SELECT * FROM ({FLAT}) WHERE flag IS NOT NULL")
          print('\n   distinct flag values:')
          for v, c in con.execute('SELECT flag, count(*) c FROM fl GROUP BY 1 ORDER BY c DESC').fetchall():
              print(f'      {c:10,d}  {v}')

          # ---------- 2. does it agree with date_closed, which we already trust? ----------
          print(f'\n== 2. AGREEMENT WITH date_closed')
          print('   (date_closed is the signal we already act on. If unresolved_flags were')
          print('    a reliable closure signal it would overlap heavily with it.)')
          rows = con.execute("""
            SELECT flag,
                   count(*) AS n,
                   count(*) FILTER (WHERE date_closed IS NOT NULL) AS also_closed,
                   count(*) FILTER (WHERE website IS NOT NULL)     AS has_site,
                   round(avg(CAST(substr(CAST(date_refreshed AS VARCHAR),1,4) AS INT)), 1) AS avg_refresh_year
            FROM fl GROUP BY 1 ORDER BY n DESC""").fetchall()
          print(f'\n   {"flag":34s} {"rows":>9s} {"also date_closed":>17s} {"has website":>12s} {"avg refresh yr":>15s}')
          for f_, n_, ac, hs, ar in rows:
              print(f'   {str(f_)[:34]:34s} {n_:9,d} {ac:11,d} ({ac/n_*100:4.1f}%) {hs:11,d} {str(ar):>15s}')
          base_closed = con.execute('SELECT count(*) FILTER (WHERE date_closed IS NOT NULL)*1.0/count(*) FROM us').fetchone()[0]
          print(f'\n   baseline: {base_closed*100:.2f}% of ALL US rows carry a date_closed.')
          print('   A flag whose "also date_closed" rate is near that baseline tells us nothing new.')

          # ---------- 3. what would acting on it cost us? ----------
          print(f'\n== 3. WHAT IT WOULD COST TO ACT ON IT')
          for f_, n_, ac, hs, ar in rows:
              still_open = n_ - ac
              print(f'   drop on "{f_}": removes {n_:,} rows, of which {still_open:,} '
                    f'({still_open/n_*100:.1f}%) have NO date_closed — i.e. we would be taking')
              print(f'      the flag\'s word for it with no second signal.')

          # ---------- 4. a named sample to eyeball ----------
          print(f'\n== 4. NAMED SAMPLE — 40 flagged places in our Hill Country test towns')
          print('   (check a handful by hand: are they actually shut?)')
          TOWNS = ('Fredericksburg','New Braunfels','Boerne','Kerrville','Wimberley','Buda',
                   'Marble Falls','Dripping Springs','Johnson City','Blanco','Bandera','Llano')
          inlist = ','.join("'"+t+"'" for t in TOWNS)
          smp = con.execute(f"""
            SELECT name, locality, flag, date_closed, date_refreshed, website
            FROM fl WHERE region='TX' AND locality IN ({inlist})
            ORDER BY random() LIMIT 40""").fetchall()
          if not smp: print('   (no flagged rows in these towns in this many shards — raise `shards` and re-run)')
          for nm, lo, fg, dc, dr, ws in smp:
              print(f'   {str(nm)[:38]:40s} {str(lo)[:16]:17s} {str(fg)[:22]:23s} closed={str(dc):10s} refreshed={str(dr)[:10]}')

          # ---------- 5. cross-tab against our own name-quality reject reasons ----------
          print(f'\n== 5. DOES IT CATCH WHAT WE ALREADY CATCH?')
          jr = con.execute("""
            SELECT count(*) FROM fl
            WHERE lower(name) SIMILAR TO '%(llc|inc|corp|wholesale|distribut|contractor|plumbing|roofing)%'""").fetchone()[0]
          print(f'   flagged rows whose NAME already looks like a non-venue: {jr:,}')
          print('   If this is a large share of the flagged set, the column is mostly re-finding')
          print('   rows our name rules already reject, and adds little.')
          print('\n== done. Nothing was written or published.')
          PY
